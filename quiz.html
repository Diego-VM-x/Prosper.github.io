<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Financiero - Prosper</title>
    <meta name="description"
        content="Pon a prueba tus conocimientos financieros con nuestro quiz interactivo y aprende mientras juegas.">
    <meta property="og:title" content="Quiz Financiero - Prosper">
    <meta property="og:description" content="¿Cuánto sabes de finanzas? Responde nuestro quiz y descubre tu nivel.">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <meta name="theme-color" content="#1E3A8A">

    <!-- Preconnect a recursos externos -->
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" defer></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cream: '#FAFAFA',
                        mint: '#10B981',
                        'mint-light': '#D1FAE5',
                        'mint-hover': '#059669',
                        navy: '#1E3A8A',
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    animation: { 'fade-in': 'fadeIn 0.3s ease-in-out' }
                }
            }
        }
    </script>
    <script>
            // Aplicar el modo oscuro inmediatamente para evitar el flash blanco
            (function () {
                const savedMode = localStorage.getItem('darkMode');
                const systemMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const isDark = savedMode === 'true' || (savedMode === null && systemMode);
                if (isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </noscript>
    <link rel="stylesheet" href="styles.css">
</head>

<body
    class="text-gray-900 bg-cream selection:bg-mint-light selection:text-navy dark:bg-[#0B0F1A] dark:text-white transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const QUIZZES = [
            {
                id: 1,
                q: "¿Qué es el 'Interés Compuesto' según el área de Aprende?",
                opts: ["Un impuesto por invertir", "Cuando tus ganancias generan sus propios intereses", "El valor de la moneda extranjera"],
                ans: 1,
                expl: "Es el efecto 'bola de nieve': los intereses ganados se reinvierten para generar más dinero de forma pasiva."
            },
            {
                id: 2,
                q: "Para un 'Fondo de Emergencia', ¿cuánto dinero se recomienda tener?",
                opts: ["1 mes de sueldo", "3 a 6 meses de tus gastos fijos", "Lo suficiente para un viaje"],
                ans: 1,
                expl: "Este 'salvavidas' te protege de imprevistos como salud o desempleo sin recurrir a deudas."
            },
            {
                id: 3,
                q: "En la regla 50/30/20, ¿a qué se destina el 30%?",
                opts: ["A deseos o gastos personales", "A la renta y comida", "Ahorro e inversión"],
                ans: 0,
                expl: "El 50% es para necesidades, el 30% para disfrutar (deseos) y el 20% para tu futuro financiero."
            },
            {
                id: 4,
                q: "¿Qué es ser un usuario 'totalero' con las tarjetas?",
                opts: ["Usar todo el límite", "Pagar solo el pago mínimo", "Pagar el total cada mes antes de la fecha de corte"],
                ans: 2,
                expl: "Ser totalero permite usar el crédito del banco gratis, sin generar intereses y mejorando tu historial."
            },
            {
                id: 5,
                q: "¿Por qué se dice que la inflación es el 'Ladrón Invisible'?",
                opts: ["Porque roba bancos", "Porque hace que tu dinero pierda poder adquisitivo cada año", "Porque es un cargo oculto"],
                ans: 1,
                expl: "Si dejas tu dinero estático, los precios suben y tus ahorros compran menos cosas con el tiempo."
            },
            {
                id: 6,
                q: "¿Cuál es la principal ventaja de un ETF?",
                opts: ["Que siempre sube", "Permite diversificar en cientos de empresas con poco dinero", "Que no tiene riesgos"],
                ans: 1,
                expl: "Un ETF es un paquete de activos que reduce el riesgo al no apostar todo a una sola empresa."
            },
            {
                id: 7,
                q: "¿Qué son los 'Gastos Hormiga'?",
                opts: ["Inversiones pequeñas", "Pequeños gastos diarios (café, chicles) que sumados son mucho dinero", "Gastos en el jardín"],
                ans: 1,
                expl: "Identificar y reducir estos micro-gastos inofensivos es clave para aumentar tu capacidad de ahorro."
            },
            {
                id: 8,
                q: "¿Qué mide el Patrimonio Neto de una persona?",
                opts: ["Lo que gana en un mes", "Lo que posee (activos) menos lo que debe (pasivos)", "El saldo de su cuenta principal"],
                ans: 1,
                expl: "Es la medida definitiva de tu salud financiera real, más allá de cuánto ganes mensualmente."
            },
            {
                id: 9,
                q: "¿Qué significa ROI?",
                opts: ["Riesgo Operativo Interno", "Rendimiento por Oficio Individual", "Retorno de Inversión"],
                ans: 2,
                expl: "Es la métrica que te indica cuánto ganaste o perdiste en relación a lo que invertiste originalmente."
            },
            {
                id: 10,
                q: "¿Cuál es tu mejor primera inversión según la app?",
                opts: ["Comprar acciones de tecnología", "Tu educación financiera", "Comprar una casa"],
                ans: 1,
                expl: "Invertir en tu conocimiento te ahorra errores costosos y te ayuda a tomar mejores decisiones."
            }
        ];

        function FeedbackFAB() {
            const [isOpen, setIsOpen] = React.useState(false);
            const [rating, setRating] = React.useState(5);
            const [comment, setComment] = React.useState("");
            const [sent, setSent] = React.useState(false);
            const [loading, setLoading] = React.useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                if (window._firebaseRuta && window._firebaseRuta.guardarSugerencia) {
                    await window._firebaseRuta.guardarSugerencia(rating, comment);
                }
                setSent(true);
                setLoading(false);
                setTimeout(() => {
                    setIsOpen(false);
                    setSent(false);
                    setComment("");
                    setRating(5);
                }, 2500);
            };

            return (
                <React.Fragment>
                    <button 
                        onClick={() => setIsOpen(true)}
                        className="fixed bottom-24 right-6 md:bottom-8 md:right-8 z-[100] bg-navy dark:bg-mint text-white w-12 h-12 md:w-14 md:h-14 rounded-2xl shadow-2xl flex items-center justify-center hover:scale-110 active:scale-95 transition-all group border-2 border-white/10"
                        title="Enviar sugerencia"
                    >
                        <i className="fas fa-comment-alt text-xl group-hover:rotate-12 transition-transform"></i>
                        <span className="absolute -top-1 -right-1 flex h-3 w-3">
                            <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-mint-hover opacity-75"></span>
                            <span className="relative inline-flex rounded-full h-3 w-3 bg-mint-hover"></span>
                        </span>
                    </button>

                    {isOpen && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-navy/80 backdrop-blur-sm animate-fade-in">
                            <div className="bg-white dark:bg-[#0F172A] w-full max-w-sm rounded-[2rem] shadow-2xl overflow-hidden border border-gray-100 dark:border-white/5 mx-auto">
                                <div className="bg-mint p-6 text-white text-center">
                                    <h3 className="text-xl font-black">Tu opinión importa</h3>
                                    <p className="text-xs text-white/80 mt-1 uppercase tracking-widest font-bold">Ayúdanos a mejorar Prosper</p>
                                </div>
                                
                                {!sent ? (
                                    <form onSubmit={handleSubmit} className="p-6 space-y-4">
                                        <div>
                                            <label className="block text-[10px] font-black uppercase text-gray-400 mb-3 tracking-[0.2em]">Calificación</label>
                                            <div className="flex justify-between gap-2">
                                                {[1,2,3,4,5].map(nu => (
                                                    <button 
                                                        key={nu}
                                                        type="button"
                                                        onClick={() => setRating(nu)}
                                                        className={`flex-1 py-3 rounded-xl border-2 transition-all font-black text-xs ${rating === nu ? 'bg-mint border-mint text-white scale-105 shadow-lg' : 'border-gray-50 dark:border-gray-800 text-gray-400 hover:border-mint/30'}`}
                                                    >
                                                        {nu}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                        
                                        <div>
                                            <label className="block text-[10px] font-black uppercase text-gray-400 mb-2 tracking-[0.2em]">Sugerencia o Mejora</label>
                                            <textarea 
                                                required
                                                value={comment}
                                                onChange={(e) => setComment(e.target.value)}
                                                placeholder="Cuéntanos cómo podemos mejorar tu experiencia..."
                                                className="w-full h-32 p-4 rounded-xl bg-gray-50 dark:bg-gray-800/50 text-gray-900 dark:text-white border border-gray-100 dark:border-gray-700 outline-none focus:ring-2 focus:ring-mint transition-all text-sm font-medium resize-none"
                                            />
                                        </div>
                                        
                                        <div className="flex gap-3 pt-2">
                                            <button 
                                                type="button"
                                                onClick={() => setIsOpen(false)}
                                                className="flex-1 py-3 text-[10px] font-black uppercase tracking-widest text-gray-400 hover:text-navy dark:hover:text-white transition-colors"
                                            >
                                                Cerrar
                                            </button>
                                            <button 
                                                type="submit"
                                                disabled={loading}
                                                className="flex-[2] py-3 bg-navy dark:bg-mint text-white rounded-xl text-[10px] font-black uppercase tracking-widest shadow-xl hover:scale-[1.02] active:scale-95 transition-all disabled:opacity-50"
                                            >
                                                {loading ? <i className="fas fa-spinner fa-spin"></i> : 'Enviar'}
                                            </button>
                                        </div>
                                    </form>
                                ) : (
                                    <div className="p-12 text-center animate-fade-in">
                                        <div className="w-16 h-16 bg-mint/10 text-mint rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                                            <i className="fas fa-check"></i>
                                        </div>
                                        <h4 className="text-xl font-black text-navy dark:text-white">¡Gracias!</h4>
                                        <p className="text-sm text-gray-500 dark:text-gray-400 mt-2 font-medium">Tu sugerencia ha sido enviada con éxito. Seguimos creciendo juntos.</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </React.Fragment>
            );
        }

        function NotificationToast() {
            const [data, setData] = React.useState({ show: false, message: "", type: "success" });

            React.useEffect(() => {
                const handler = (e) => {
                    setData({ show: true, message: e.detail.message, type: e.detail.type || "success" });
                    setTimeout(() => setData(prev => ({ ...prev, show: false })), 4000);
                };
                window.addEventListener('prosper-alert', handler);
                window.showToast = (message, type = "success") => {
                    window.dispatchEvent(new CustomEvent('prosper-alert', { detail: { message, type } }));
                };
                return () => window.removeEventListener('prosper-alert', handler);
            }, []);

            if (!data.show) return null;

            const colors = {
                success: 'bg-mint text-white border-mint-hover shadow-lg shadow-mint/20',
                error: 'bg-red-500 text-white border-red-600 shadow-lg shadow-red-500/20',
                info: 'bg-navy dark:bg-gray-800 text-white border-blue-600 shadow-lg shadow-navy/20'
            };

            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                info: 'fa-info-circle'
            };

            return (
                <div 
                    className={`fixed top-8 left-1/2 -translate-x-1/2 z-[500] px-6 py-4 rounded-[1.5rem] border-2 flex items-center gap-4 animate-fade-in transition-all active:scale-95 cursor-pointer max-w-[90%] w-auto ${colors[data.type]}`} 
                    onClick={() => setData({ ...data, show: false })}
                >
                    <i className={`fas ${icons[data.type]} text-2xl`}></i>
                    <div className="flex flex-col">
                        <span className="text-[10px] font-black uppercase tracking-widest leading-none mb-1 opacity-70">
                            {data.type === 'success' ? 'Éxito' : (data.type === 'error' ? 'Error' : 'Notificación')}
                        </span>
                        <span className="text-xs font-bold leading-tight">{data.message}</span>
                    </div>
                </div>
            );
        }

        function CustomConfirm({ isOpen, message, onConfirm, onCancel }) {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[600] flex items-center justify-center p-4 bg-navy/80 backdrop-blur-sm animate-fade-in">
                    <div className="bg-white dark:bg-[#0F172A] w-full max-w-sm rounded-[2rem] shadow-2xl overflow-hidden border border-gray-100 dark:border-white/5 mx-auto">
                        <div className="p-8 text-center text-navy dark:text-white">
                            <i className="fas fa-question-circle text-4xl text-mint mb-4"></i>
                            <h3 className="text-xl font-black mb-2 tracking-tight">¿Estás seguro?</h3>
                            <p className="text-sm font-medium opacity-70 mb-8">{message}</p>
                            <div className="flex gap-4">
                                <button onClick={onCancel} className="flex-1 py-4 text-[11px] font-black uppercase tracking-widest text-gray-400 hover:text-navy dark:hover:text-white transition-colors">Cancelar</button>
                                <button onClick={onConfirm} className="flex-1 py-4 bg-mint text-white rounded-2xl text-[11px] font-black uppercase tracking-widest shadow-xl hover:scale-105 active:scale-95 transition-all">Confirmar</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function QuizList() {
            const [answers, setAnswers] = useState(() => {
                const saved = localStorage.getItem('prosper_quiz_answers');
                return saved ? JSON.parse(saved) : {};
            });
            const [scores, setScores] = useState(() => {
                const saved = localStorage.getItem('prosper_quiz_scores');
                return saved ? JSON.parse(saved) : {};
            });

            const [showConfirmReset, setShowConfirmReset] = useState(false);

            const handleAnswer = (qId, optIdx, correctIdx) => {
                if (answers[qId] !== undefined) return;

                const newAnswers = { ...answers, [qId]: optIdx };
                const newScores = { ...scores, [qId]: optIdx === correctIdx };
                
                setAnswers(newAnswers);
                setScores(newScores);
                
                localStorage.setItem('prosper_quiz_answers', JSON.stringify(newAnswers));
                localStorage.setItem('prosper_quiz_scores', JSON.stringify(newScores));
            };

            const resetProgress = () => {
                setShowConfirmReset(true);
            };

            const confirmReset = () => {
                setAnswers({});
                setScores({});
                localStorage.removeItem('prosper_quiz_answers');
                localStorage.removeItem('prosper_quiz_scores');
                setShowConfirmReset(false);
                if (window.showToast) window.showToast("¡Progreso reiniciado correctamente!", "info");
            };

            const sendToFirebase = async () => {
                const totalCorrect = Object.values(scores).filter(v => v).length;
                if (window._firebaseRuta && window._firebaseRuta.guardarQuiz) {
                    await window._firebaseRuta.guardarQuiz(totalCorrect, answers);
                    if (window.showToast) window.showToast("¡Puntuación guardada exitosamente en tu perfil!", "success");
                } else {
                    if (window.showToast) window.showToast("Debes iniciar sesión para guardar tu progreso.", "error");
                }
            };

            return (
                <div className="space-y-6">
                    <div className="bg-navy dark:bg-gray-900 p-6 md:p-8 rounded-3xl flex flex-col md:flex-row items-center justify-between text-white shadow-2xl relative overflow-hidden transition-all duration-300 border border-white/5">
                        <i className="fas fa-brain absolute -right-4 -bottom-4 text-blue-900 dark:text-gray-800 opacity-20 text-9xl z-0"></i>
                        <div className="z-10 text-center md:text-left mb-6 md:mb-0">
                            <h2 className="text-3xl font-black tracking-tight text-white mb-2">Quiz de Conocimiento</h2>
                            <p className="text-blue-100 dark:text-gray-300 font-medium text-sm md:text-base max-w-xl">
                                ¡Pon a prueba lo aprendido! <span className="text-mint font-bold italic">Importante:</span> Todo el contenido de este quiz se encuentra en la sección de <a href="aprende.html" className="text-mint underline hover:text-white transition-colors">Aprende</a>. Al guardar tus puntos, analizaremos las respuestas para saber qué contenidos profundizar y mejorar el quiz para ti.
                            </p>
                            <div className="flex flex-wrap justify-center md:justify-start gap-3 mt-6">
                                <button onClick={resetProgress} className="px-4 py-2 bg-white/10 hover:bg-white/20 border border-white/10 rounded-xl text-xs font-black uppercase tracking-widest transition-all active:scale-95">
                                    <i className="fas fa-redo-alt mr-2"></i> Reiniciar
                                </button>
                                <button onClick={sendToFirebase} className="px-4 py-2 bg-mint hover:bg-mint-hover text-white rounded-xl text-xs font-black uppercase tracking-widest transition-all shadow-lg active:scale-95">
                                    <i className="fas fa-cloud-upload-alt mr-2"></i> Guardar Puntos
                                </button>
                            </div>
                        </div>
                        <div className="relative z-10">
                            <div className="w-24 h-24 md:w-28 md:h-28 bg-white/10 border-4 border-white/10 rounded-full flex flex-col items-center justify-center backdrop-blur-md shadow-2xl">
                                <span className="font-black text-4xl md:text-5xl text-mint">{Object.values(scores).filter(v => v).length}</span>
                                <span className="text-[10px] font-black uppercase tracking-widest text-blue-200 mt-1">Puntos</span>
                            </div>
                        </div>
                    </div>

                    {QUIZZES.map((quiz, i) => {
                        const isAnswered = answers[quiz.id] !== undefined;
                        const isCorrect = scores[quiz.id];

                        let borderClass = "border-gray-100 dark:border-gray-700";
                        if (isAnswered) borderClass = isCorrect ? "border-mint bg-mint-light/10 dark:bg-mint-light/5" : "border-red-400 bg-red-50/20 dark:bg-red-500/10";

                        return (
                            <div key={quiz.id} className={`bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-sm border-2 animate-fade-in ${borderClass} card-hover transition-colors duration-300`}>
                                <h3 className="font-bold text-navy dark:text-white text-lg mb-4 leading-tight">
                                    <span className="text-mint mr-2">#{i + 1}</span>{quiz.q}
                                </h3>
                                <div className="space-y-3">
                                    {quiz.opts.map((opt, optIdx) => {
                                        let btnClass = "w-full text-left p-4 rounded-xl border-2 font-medium smooth-transition text-sm md:text-base leading-tight ";
                                        if (isAnswered) {
                                            if (optIdx === quiz.ans) {
                                                btnClass += "bg-mint border-mint text-white shadow-md transform scale-[1.02] font-bold";
                                            } else if (answers[quiz.id] === optIdx) {
                                                btnClass += "bg-red-50 dark:bg-red-500/20 border-red-300 dark:border-red-500/50 text-red-800 dark:text-red-400";
                                            } else {
                                                btnClass += "bg-gray-50 dark:bg-gray-800/50 border-gray-100 dark:border-gray-700 text-gray-400 dark:text-gray-500 opacity-60";
                                            }
                                        } else {
                                            btnClass += "bg-white dark:bg-gray-800 border-gray-200 dark:border-gray-700 hover:border-mint dark:hover:border-mint hover:bg-gray-50 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300";
                                        }

                                        return (
                                            <button
                                                key={optIdx}
                                                onClick={() => handleAnswer(quiz.id, optIdx, quiz.ans)}
                                                disabled={isAnswered}
                                                className={btnClass}
                                            >
                                                {opt}
                                            </button>
                                        )
                                    })}
                                </div>

                                {isAnswered && (
                                    <div className={`mt-4 p-4 rounded-xl ${isCorrect ? 'bg-mint-light/50 dark:bg-mint-light/10 border border-mint/20 dark:border-mint/10' : 'bg-red-50 dark:bg-red-500/10 border border-red-100 dark:border-red-500/20'}`}>
                                        <p className="text-sm font-medium leading-relaxed text-gray-700 dark:text-gray-300">
                                            <span className={`font-bold ${isCorrect ? 'text-mint-hover dark:text-mint-light' : 'text-red-500 dark:text-red-400'} mr-2`}>
                                                {isCorrect ? '¡Correcto!' : 'Explicación:'}
                                            </span>
                                            {quiz.expl}
                                        </p>
                                    </div>
                                )}
                            </div>
                        )
                    })}
                    <CustomConfirm 
                        isOpen={showConfirmReset} 
                        message="Esta acción borrará todas tus respuestas y puntuaciones actuales del quiz. No se puede deshacer." 
                        onConfirm={confirmReset}
                        onCancel={() => setShowConfirmReset(false)}
                    />
                </div>
            )
        }

        function RegisterModal({ isOpen, onClose, onRegister, darkMode }) {
            if (!isOpen) return null;

            const [formData, setFormData] = React.useState({
                name: '',
                email: '',
                goal: ''
            });
            const [isSubmitting, setIsSubmitting] = React.useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);

                const formToSubmit = new FormData();
                formToSubmit.append('name', formData.name);
                formToSubmit.append('email', formData.email);
                formToSubmit.append('meta_financiera', formData.goal);
                formToSubmit.append('_captcha', 'false');
                formToSubmit.append('_subject', 'Nuevo Registro Prosper');

                try {
                    await fetch('https://formspree.io/f/xlgpoajn', {
                        method: 'POST',
                        body: formToSubmit
                    });
                    localStorage.setItem('userName', formData.name);
                    localStorage.setItem('isLoggedIn', 'true');
                    onRegister(formData.name);
                    onClose();
                } catch (error) {
                    localStorage.setItem('userName', formData.name);
                    localStorage.setItem('isLoggedIn', 'true');
                    onRegister(formData.name);
                    onClose();
                } finally {
                    setIsSubmitting(false);
                }
            };

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-navy/60 backdrop-blur-sm animate-fade-in">
                    <div className={`w-full max-w-md rounded-3xl shadow-2xl overflow-hidden transform transition-all ${darkMode ? 'bg-gray-800 text-white' : 'bg-white text-navy'}`}>
                        <div className="relative p-6 md:p-8">
                            <button onClick={onClose} className="absolute top-4 right-4 text-gray-400 hover:text-mint transition-colors">
                                <i className="fas fa-times text-xl"></i>
                            </button>

                            <div className="text-center mb-8">
                                <div className="bg-mint/10 text-mint w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 transform rotate-3">
                                    <i className="fas fa-user-plus text-2xl"></i>
                                </div>
                                <h2 className="text-2xl font-black">Únete a Prosper.</h2>
                                <p className={`text-sm mt-2 ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Comienza tu camino hacia la libertad financiera.</p>
                            </div>

                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold uppercase tracking-wider mb-1.5 ml-1 opacity-70">Nombre Completo</label>
                                    <input
                                        required
                                        type="text"
                                        placeholder="Ej. Juan Pérez"
                                        className={`w-full p-3.5 rounded-2xl border bg-cream outline-none focus:ring-2 focus:ring-mint/50 transition-all ${darkMode ? 'border-gray-700 bg-gray-900/50' : 'border-gray-100 bg-gray-50'}`}
                                        value={formData.name}
                                        onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold uppercase tracking-wider mb-1.5 ml-1 opacity-70">Correo Electrónico</label>
                                    <input
                                        required
                                        type="email"
                                        placeholder="tu@email.com"
                                        className={`w-full p-3.5 rounded-2xl border bg-cream outline-none focus:ring-2 focus:ring-mint/50 transition-all ${darkMode ? 'border-gray-700 bg-gray-900/50' : 'border-gray-100 bg-gray-50'}`}
                                        value={formData.email}
                                        onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold uppercase tracking-wider mb-1.5 ml-1 opacity-70">Meta Financiera</label>
                                    <textarea
                                        required
                                        placeholder="Ej. Comprar mi primer depa, invertir en la bolsa..."
                                        rows="2"
                                        className={`w-full p-3.5 rounded-2xl border bg-cream outline-none focus:ring-2 focus:ring-mint/50 transition-all ${darkMode ? 'border-gray-700 bg-gray-900/50' : 'border-gray-100 bg-gray-50'}`}
                                        value={formData.goal}
                                        onChange={(e) => setFormData({ ...formData, goal: e.target.value })}
                                    ></textarea>
                                </div>

                                <button
                                    disabled={isSubmitting}
                                    type="submit"
                                    className="w-full bg-gradient-to-r from-[#1E3A8A] to-[#1e40af] text-white font-bold py-4 rounded-2xl shadow-lg shadow-navy/20 transform hover:scale-[1.02] active:scale-95 transition-all mt-4 flex items-center justify-center"
                                >
                                    {isSubmitting ? (
                                        <i className="fas fa-circle-notch fa-spin mr-2"></i>
                                    ) : (
                                        <i className="fas fa-paper-plane mr-2"></i>
                                    )}
                                    {isSubmitting ? 'Enviando...' : 'Empezar ahora'}
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [contentWidth, setContentWidth] = useState(() => localStorage.getItem('contentWidth') || 'max-w-6xl');
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [showRegisterModal, setShowRegisterModal] = useState(false);
            const [isLoggedIn, setIsLoggedIn] = useState(() => localStorage.getItem('isLoggedIn') === 'true');
            const [userName, setUserName] = useState(() => localStorage.getItem('userName') || '');
            const [darkMode, setDarkMode] = useState(() => {
                const saved = localStorage.getItem('darkMode');
                if (saved !== null) return saved === 'true';
                return window.matchMedia('(prefers-color-scheme: dark)').matches;
            });

            React.useEffect(() => {
                localStorage.setItem('contentWidth', contentWidth);
            }, [contentWidth]);

            React.useEffect(() => {
                localStorage.setItem('isLoggedIn', isLoggedIn);
            }, [isLoggedIn]);

            React.useEffect(() => {
                const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
                const handleChange = (e) => {
                    setDarkMode(e.matches);
                };
                mediaQuery.addEventListener('change', handleChange);
                return () => mediaQuery.removeEventListener('change', handleChange);
            }, []);

            React.useEffect(() => {
                localStorage.setItem('darkMode', darkMode);
                localStorage.setItem('darkMode', darkMode);
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [darkMode]);

            const handleRegister = (name) => {
                setUserName(name);
                setIsLoggedIn(true);
            };

            const toggleUserMenu = () => {
                setMobileMenuOpen(!mobileMenuOpen);
            };

            return (
                <div className={`min-h-screen flex flex-col ${darkMode ? 'dark' : ''}`}>
                    <header className={`backdrop-blur-md shadow-sm sticky top-0 z-50 border-b pb-safe-top transition-colors duration-300 ${darkMode ? 'bg-gray-900/90 border-gray-800 text-white' : 'bg-white/90 border-gray-100 text-gray-800'}`}>
                        <div className={`mx-auto px-4 sm:px-6 lg:px-8 transition-all duration-500 ${contentWidth}`}>
                            <div className="flex justify-between h-16 md:h-20 items-center">
                                <div className="flex items-center cursor-pointer" onClick={() => window.location.href = 'index.html'}>
                                    <div className="bg-mint text-white p-2 rounded-xl mr-3 shadow-md transform rotate-3">
                                        <i className="fas fa-chart-line text-lg"></i>
                                    </div>
                                    <span className={`font-black text-2xl tracking-tight transition-colors ${darkMode ? 'text-white' : 'text-navy'}`}>Prosper<span className="text-mint">.</span></span>
                                </div>

                                <nav className="hidden md:flex space-x-10 items-center h-full">
                                    <a href="index.html" className="nav-line-neon h-full flex items-center text-gray-400 dark:text-gray-500 hover:text-navy dark:hover:text-white font-black uppercase text-xs tracking-widest px-1 py-1 smooth-transition">Inicio</a>
                                    <a href="aprende.html" className="nav-line-neon h-full flex items-center text-gray-400 dark:text-gray-500 hover:text-navy dark:hover:text-white font-black uppercase text-xs tracking-widest px-1 py-1 smooth-transition">Aprende</a>
                                    <a href="tools.html" className="nav-line-neon h-full flex items-center text-gray-400 dark:text-gray-500 hover:text-navy dark:hover:text-white font-black uppercase text-xs tracking-widest px-1 py-1 smooth-transition">Herramientas</a>
                                    <a href="quiz.html" className="nav-line-neon active h-full flex items-center font-black uppercase text-xs tracking-widest px-1 py-1">Quiz</a>
                                    <a href="route.html" className="nav-line-neon h-full flex items-center text-gray-400 dark:text-gray-500 hover:text-navy dark:hover:text-white font-black uppercase text-xs tracking-widest px-1 py-1 smooth-transition">Mis Retos</a>
                                </nav>

                                <div className="flex items-center">
                                    <button onClick={toggleUserMenu} className={`p-2 rounded-xl smooth-transition focus:outline-none flex items-center w-10 h-10 justify-center ${darkMode ? 'bg-gray-800 text-white hover:bg-gray-700' : 'bg-gray-50 text-navy hover:bg-gray-100'}`}>
                                        <i className={`fas ${mobileMenuOpen ? 'fa-times' : (isLoggedIn ? 'fa-user-check text-mint' : 'fa-user')} text-xl text-center flex items-center`}></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        {mobileMenuOpen && (
                            <div className={`absolute right-4 top-16 md:right-8 md:top-20 w-64 shadow-2xl z-50 animate-fade-in rounded-2xl overflow-hidden origin-top-right border ${darkMode ? 'bg-gray-800 border-gray-700 text-white' : 'bg-white border-gray-100 text-gray-800'}`}>
                                <div className="p-3 space-y-1">
                                    <div className={`px-3 py-3 border-b mb-2 ${darkMode ? 'border-gray-700' : 'border-gray-100'}`}>
                                        <p className="text-sm font-bold">{isLoggedIn ? userName : 'Invitado'}</p>
                                        <p className="text-xs opacity-70">{isLoggedIn ? 'Usuario Verificado' : 'Sin iniciar sesión'}</p>
                                    </div>

                                    {!isLoggedIn && (
                                        <button onClick={() => { setShowRegisterModal(true); setMobileMenuOpen(false); }} className={`w-full flex items-center px-4 py-3 rounded-xl text-sm font-semibold smooth-transition text-left text-mint ${darkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-50'}`}>
                                            <i className="fas fa-sign-in-alt w-6"></i> Iniciar Sesión
                                        </button>
                                    )}

                                    <a href="acerca.html" className={`flex items-center px-4 py-3 rounded-xl text-sm font-semibold smooth-transition ${darkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-50'}`}>
                                        <i className="fas fa-info-circle w-6 text-blue-500"></i> Aprende a usar la app
                                    </a>
                                    <button onClick={() => { setDarkMode(!darkMode); setMobileMenuOpen(false); }} className={`w-full flex items-center justify-between px-4 py-3 rounded-xl text-sm font-semibold smooth-transition text-left ${darkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-50'}`}>
                                        <div className="flex items-center">
                                            <i className={`fas ${darkMode ? 'fa-sun text-yellow-500' : 'fa-moon text-indigo-500'} w-6`}></i>
                                            Tema {darkMode ? 'Claro' : 'Oscuro'}
                                        </div>
                                    </button>
                                    {isLoggedIn && (
                                        <button onClick={() => { localStorage.clear(); window.location.reload(); }} className={`w-full flex items-center px-4 py-3 rounded-xl text-sm font-semibold smooth-transition text-left text-red-500 ${darkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-50'}`}>
                                            <i className="fas fa-sign-out-alt w-6"></i> Cerrar Sesión
                                        </button>
                                    )}

                                    {/* Ajuste de Ancho (PC) */}
                                    <div className="hidden md:block p-4 border-t border-gray-100 dark:border-gray-700">
                                        <p className="text-[10px] font-black text-gray-400 dark:text-gray-500 uppercase tracking-[0.2em] mb-3">Anchura de la web</p>
                                        <div className="flex gap-2 bg-gray-50 dark:bg-gray-900 p-1 rounded-xl">
                                            {[
                                                { id: 'max-w-4xl', label: 'Pequeño' },
                                                { id: 'max-w-6xl', label: 'Mediano' },
                                                { id: 'max-w-[1400px]', label: 'Grande' }
                                            ].map(opt => (
                                                <button 
                                                    key={opt.id}
                                                    onClick={() => setContentWidth(opt.id)}
                                                    className={`flex-1 py-2 text-[9px] font-black uppercase rounded-lg transition-all ${contentWidth === opt.id ? 'bg-mint text-white shadow-md' : 'text-gray-400 hover:text-navy dark:hover:text-white'}`}
                                                >
                                                    {opt.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </header>

                    <main className={`flex-grow mx-auto px-4 sm:px-6 lg:px-8 py-8 md:py-12 pb-24 md:pb-12 transition-all duration-500 animate-fade-in ${contentWidth}`}>
                        <QuizList />
                    </main>

                    <RegisterModal
                        isOpen={showRegisterModal}
                        onClose={() => setShowRegisterModal(false)}
                        onRegister={handleRegister}
                        darkMode={darkMode}
                    />

                    {/* Bottom Nav para APK/Mobile */}
                    <div className="md:hidden fixed bottom-0 left-0 w-full transition-colors duration-300 backdrop-blur-md border-t z-50 pb-safe shadow-[0_-5px_15px_rgba(0,0,0,0.05)] dark:bg-gray-900/95 dark:border-gray-800 bg-white/95 border-gray-200 bottom-nav-neon-top">
                        <div className="flex justify-around items-end h-16 pb-2 relative">
                            <a href="aprende.html" className="flex flex-col items-center justify-center w-full text-gray-400 dark:text-gray-500 hover:text-navy dark:hover:text-white smooth-transition h-full pt-1">
                                <i className="fas fa-book-open text-xl mb-1 mt-1"></i>
                                <span className="text-[10px] font-black uppercase">Aprende</span>
                            </a>
                            <a href="quiz.html" className="flex flex-col items-center justify-center w-full smooth-transition h-full pt-1">
                                <i className="fas fa-bolt text-xl mb-1 mt-1 text-mint"></i>
                                <span className="text-[10px] font-black uppercase text-mint active-text-glow">Quiz</span>
                            </a>

                            <a href="index.html" className="flex flex-col items-center justify-center w-full relative z-10 bottom-3">
                                <div className="bg-gray-100 dark:bg-gray-800 text-gray-500 dark:text-gray-500 hover:text-mint dark:hover:text-mint-light w-14 h-14 rounded-full flex items-center justify-center shadow-[0_-2px_10px_rgba(0,0,0,0.05)] border-4 border-white dark:border-gray-900 transform hover:scale-105 smooth-transition">
                                    <i className="fas fa-home text-2xl"></i>
                                </div>
                                <span className="text-[10px] font-black uppercase text-gray-500 dark:text-gray-500 mt-1">Inicio</span>
                            </a>

                            <a href="tools.html" className="flex flex-col items-center justify-center w-full text-gray-400 dark:text-gray-500 hover:text-navy dark:hover:text-white smooth-transition h-full pt-1">
                                <i className="fas fa-tools text-xl mb-1 mt-1"></i>
                                <span className="text-[10px] font-black uppercase">Útiles</span>
                            </a>
                            <a href="route.html" className="flex flex-col items-center justify-center w-full text-gray-400 dark:text-gray-500 hover:text-navy dark:hover:text-white smooth-transition h-full pt-1">
                                <i className="fas fa-route text-xl mb-1 mt-1"></i>
                                <span className="text-[10px] font-black uppercase">Mis Retos</span>
                            </a>
                        </div>
                    </div>

                    <FeedbackFAB />
                    <NotificationToast />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script type="module" src="auth-ui.js"></script>
    <script type="module" src="route-firebase.js"></script>
</body>

</html>
