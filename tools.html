<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadoras Financieras - Prosper</title>
    <meta name="description"
        content="Utiliza nuestra calculadora de interés compuesto, 50/30/20 y ROI para planificar tu futuro financiero.">
    <meta property="og:title" content="Calculadoras Financieras - Prosper">
    <meta property="og:description"
        content="Herramientas gratuitas para calcular tu ahorro, inversión y patrimonio neto.">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <meta name="theme-color" content="#1E3A8A">

    <!-- Preconnect a recursos externos -->
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" defer></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cream: '#FAFAFA',
                        mint: '#10B981',
                        'mint-light': '#D1FAE5',
                        'mint-hover': '#059669',
                        navy: '#1E3A8A',
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    animation: { 'fade-in': 'fadeIn 0.3s ease-in-out' },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(-10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <script>
            // Aplicar el modo oscuro inmediatamente para evitar el flash blanco
            (function () {
                const savedMode = localStorage.getItem('darkMode');
                const systemMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const isDark = savedMode === 'true' || (savedMode === null && systemMode);
                if (isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </noscript>
    <link rel="stylesheet" href="styles.css">
</head>

<body
    class="text-gray-900 bg-cream selection:bg-mint-light selection:text-navy dark:bg-[#0B0F1A] dark:text-white transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function GastosHormiga() {
            const [productName, setProductName] = useState('');
            const [cost, setCost] = useState('');
            const [frequency, setFrequency] = useState('1');
            const [result, setResult] = useState(null);

            const handleCalculate = () => {
                const valCost = parseFloat(cost);
                const valFreq = parseFloat(frequency);
                if (!isNaN(valCost) && valCost > 0 && !isNaN(valFreq) && valFreq > 0) {
                    const dailyCost = (valCost * valFreq) / 7;
                    setResult({
                        name: productName.trim() || 'este hábito',
                        days15: dailyCost * 15,
                        month: dailyCost * 30,
                        year: dailyCost * 365
                    });
                } else setResult(null);
            };

            return (
                <div className="animate-fade-in relative">
                    <p className="text-gray-600 dark:text-gray-400 text-sm mb-5 italic">Analiza cuánto podrías ahorrar si dejas de comprar ese "capricho" frecuente.</p>
                    <div className="space-y-4 mb-5">
                        <input type="text" value={productName} onChange={(e) => setProductName(e.target.value)} placeholder="¿En qué gastas? (Ej. Café)" className="w-full px-4 py-3 bg-gray-50 dark:bg-gray-900 border-2 border-transparent focus:border-mint rounded-xl outline-none font-semibold dark:text-white transition-all" />
                        <div className="grid grid-cols-2 gap-4">
                            <input type="number" value={cost} onChange={(e) => setCost(e.target.value)} placeholder="Costo ($)" className="w-full px-4 py-3 bg-gray-50 dark:bg-gray-900 rounded-xl outline-none font-bold dark:text-white" />
                            <select value={frequency} onChange={(e) => setFrequency(e.target.value)} className="w-full px-4 py-3 bg-gray-50 dark:bg-gray-900 rounded-xl outline-none font-bold dark:text-white">
                                <option value="1">1 vez/semana</option>
                                <option value="3">3 veces/semana</option>
                                <option value="7">A diario</option>
                            </select>
                        </div>
                    </div>
                    <button onClick={handleCalculate} className="w-full bg-navy text-white font-bold py-3.5 rounded-xl hover:bg-blue-900 transition-all">Calcular Ahorro</button>
                    {result && (
                        <div className="mt-5 p-5 bg-mint-light/40 dark:bg-mint/10 rounded-xl border border-mint/20">
                            <div className="flex justify-between items-center mb-2"><span className="text-xs font-bold uppercase dark:text-gray-300">En 1 mes</span><span className="font-black text-navy dark:text-mint-light text-lg">${result.month.toFixed(2)}</span></div>
                            <div className="flex justify-between items-center"><span className="text-xs font-bold uppercase dark:text-gray-300">En 1 año</span><span className="font-black text-mint-hover dark:text-mint text-2xl">${result.year.toFixed(2)}</span></div>
                        </div>
                    )}
                </div>
            )
        }

        function MonthlyBudget() {
            const [income, setIncome] = useState('');
            const [result, setResult] = useState(null);
            const calc = () => {
                let inc = parseFloat(income);
                if (inc > 0) setResult({ needs: inc * 0.5, wants: inc * 0.3, savings: inc * 0.2 });
                else setResult(null);
            };
            return (
                <div className="animate-fade-in">
                    <p className="text-gray-600 dark:text-gray-400 text-sm mb-5 italic">Divide tus ingresos con la regla 50/30/20.</p>
                    <input type="number" value={income} onChange={(e) => setIncome(e.target.value)} placeholder="Ingreso Mensual ($)" className="w-full px-4 py-3 bg-gray-50 dark:bg-gray-900 border-2 border-transparent focus:border-purple-500 rounded-xl outline-none font-bold dark:text-white mb-5 transition-all" />
                    <button onClick={calc} className="w-full bg-purple-600 text-white font-bold py-3.5 rounded-xl hover:bg-purple-700 transition-all">Distribuir Presupuesto</button>
                    {result && (
                        <div className="mt-5 space-y-3">
                            <div className="flex justify-between p-3 bg-indigo-50 dark:bg-indigo-900/20 rounded-xl dark:border dark:border-indigo-800">
                                <span className="text-sm font-semibold text-indigo-700 dark:text-indigo-400">50% Necesidades</span>
                                <span className="font-black dark:text-white">${result.needs.toFixed(2)}</span>
                            </div>
                            <div className="flex justify-between p-3 bg-pink-50 dark:bg-pink-900/20 rounded-xl dark:border dark:border-pink-800">
                                <span className="text-sm font-semibold text-pink-700 dark:text-pink-400">30% Deseos</span>
                                <span className="font-black dark:text-white">${result.wants.toFixed(2)}</span>
                            </div>
                            <div className="flex justify-between p-3 bg-mint-light dark:bg-mint/10 rounded-xl font-bold border border-mint/20">
                                <span className="text-sm text-mint-hover dark:text-mint">20% Ahorro</span>
                                <span className="font-black text-mint-hover dark:text-mint">${result.savings.toFixed(2)}</span>
                            </div>
                        </div>
                    )}
                </div>
            )
        }

        function ROICalculator() {
            const [initial, setInitial] = useState('');
            const [final, setFinal] = useState('');
            const [result, setResult] = useState(null);
            const calc = () => {
                let i = parseFloat(initial); let f = parseFloat(final);
                if (i > 0) setResult(((f - i) / i) * 100);
                else setResult(null);
            };
            return (
                <div className="animate-fade-in">
                    <p className="text-gray-600 dark:text-gray-400 text-sm mb-5 italic">Calcula el rendimiento porcentual de cualquier inversión.</p>
                    <div className="space-y-4 mb-5">
                        <input type="number" value={initial} onChange={(e) => setInitial(e.target.value)} placeholder="Inversión Inicial ($)" className="w-full px-4 py-3 bg-gray-50 dark:bg-gray-900 border-2 border-transparent focus:border-blue-500 rounded-xl outline-none font-bold dark:text-white transition-all" />
                        <input type="number" value={final} onChange={(e) => setFinal(e.target.value)} placeholder="Valor Final ($)" className="w-full px-4 py-3 bg-gray-50 dark:bg-gray-900 border-2 border-transparent focus:border-blue-500 rounded-xl outline-none font-bold dark:text-white transition-all" />
                    </div>
                    <button onClick={calc} className="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl hover:bg-blue-700 transition-all">Calcular Retorno</button>
                    {result !== null && (
                        <div className="mt-5 p-5 bg-blue-50 dark:bg-blue-900/20 text-center rounded-2xl border-2 border-blue-100 dark:border-blue-800">
                            <span className="text-xs font-bold uppercase text-blue-600 dark:text-blue-400 block mb-1">ROI obtenido</span>
                            <div className="text-4xl font-black text-blue-700 dark:text-blue-400">{result.toFixed(2)}%</div>
                        </div>
                    )}
                </div>
            )
        }

        function CompoundInterest() {
            const [p, setP] = useState('');
            const [r, setR] = useState('');
            const [t, setT] = useState('');
            const [res, setRes] = useState(null);
            const calc = () => { if(p&&r&&t) setRes(p * Math.pow(1 + (r/100), t)); };
            return (
                <div className="animate-fade-in space-y-4">
                    <p className="text-gray-600 dark:text-gray-400 text-sm italic mb-2">Mira cómo crece tu capital con el tiempo.</p>
                    <input type="number" value={p} onChange={(e)=>setP(e.target.value)} placeholder="Capital Inicial ($)" className="w-full p-4 bg-gray-50 dark:bg-gray-900 border-2 border-transparent focus:border-emerald-500 rounded-2xl font-bold outline-none dark:text-white transition-all" />
                    <div className="grid grid-cols-2 gap-4">
                        <input type="number" value={r} onChange={(e)=>setR(e.target.value)} placeholder="% Anual" className="p-4 bg-gray-50 dark:bg-gray-900 border-2 border-transparent focus:border-emerald-500 rounded-2xl font-bold outline-none dark:text-white transition-all" />
                        <input type="number" value={t} onChange={(e)=>setT(e.target.value)} placeholder="Años" className="p-4 bg-gray-50 dark:bg-gray-900 border-2 border-transparent focus:border-emerald-500 rounded-2xl font-bold outline-none dark:text-white transition-all" />
                    </div>
                    <button onClick={calc} className="w-full bg-emerald-600 text-white font-bold py-4 rounded-2xl hover:bg-emerald-700 transition-all">Proyectar Crecimiento</button>
                    {res && (
                        <div className="p-6 bg-navy dark:bg-gray-800 text-white text-center rounded-3xl shadow-xl border dark:border-gray-700">
                            <span className="text-[10px] uppercase font-black tracking-widest block mb-1 opacity-70">Capital Estimado Final</span>
                            <div className="text-4xl font-black text-mint">${res.toLocaleString()}</div>
                        </div>
                    )}
                </div>
            )
        }

        function EmergencyFund() {
            const [expenses, setExpenses] = useState('');
            const [months, setMonths] = useState('6');
            const [result, setResult] = useState(null);
            const calc = () => { if(expenses) setResult(expenses * months); };
            return (
                <div className="animate-fade-in space-y-4">
                    <p className="text-gray-600 dark:text-gray-400 text-sm italic mb-2">Calcula cuánto necesitas para estar seguro ante imprevistos.</p>
                    <input type="number" value={expenses} onChange={(e)=>setExpenses(e.target.value)} placeholder="Gastos Mensuales ($)" className="w-full p-4 bg-gray-50 dark:bg-gray-900 border-2 border-transparent focus:border-yellow-500 rounded-2xl font-bold outline-none dark:text-white transition-all" />
                    <select value={months} onChange={(e)=>setMonths(e.target.value)} className="w-full p-4 bg-gray-50 dark:bg-gray-900 rounded-2xl font-bold outline-none dark:text-white">
                        <option value="3">3 Meses (Mínimo)</option>
                        <option value="6">6 Meses (Ideal)</option>
                        <option value="12">12 Meses (Seguridad Total)</option>
                    </select>
                    <button onClick={calc} className="w-full bg-yellow-500 text-white font-bold py-4 rounded-2xl hover:bg-yellow-600 transition-all">Calcular Meta de Ahorro</button>
                    {result && (
                        <div className="p-6 bg-yellow-50 dark:bg-yellow-900/10 text-center rounded-3xl border-2 border-yellow-200 dark:border-yellow-900/30">
                            <span className="text-[10px] uppercase font-black text-yellow-800 dark:text-yellow-400 block mb-1">Tu fondo debe ser de</span>
                            <div className="text-4xl font-black text-yellow-800 dark:text-yellow-500">${result.toLocaleString()}</div>
                        </div>
                    )}
                </div>
            )
        }

        function NetWorth() {
            const [assets, setAssets] = useState('');
            const [liabilities, setLiabilities] = useState('');
            const [result, setResult] = useState(null);
            const calc = () => { setResult((parseFloat(assets)||0) - (parseFloat(liabilities)||0)); };
            return (
                <div className="animate-fade-in space-y-4">
                    <p className="text-gray-600 dark:text-gray-400 text-sm italic mb-2">La métrica definitiva de tu salud financiera actual (Activos - Deudas).</p>
                    <input type="number" value={assets} onChange={(e)=>setAssets(e.target.value)} placeholder="Total Activos (Lo que tienes) ($)" className="w-full p-4 bg-gray-50 dark:bg-gray-900 border-2 border-transparent focus:border-navy rounded-2xl font-bold outline-none dark:text-white transition-all" />
                    <input type="number" value={liabilities} onChange={(e)=>setLiabilities(e.target.value)} placeholder="Total Deudas (Lo que debes) ($)" className="w-full p-4 bg-gray-50 dark:bg-gray-900 border-2 border-transparent focus:border-red-500 rounded-2xl font-bold outline-none dark:text-white transition-all" />
                    <button onClick={calc} className="w-full bg-navy text-white font-bold py-4 rounded-2xl hover:bg-blue-900 transition-all">Calcular Patrimonio</button>
                    {result !== null && (
                        <div className={`p-6 rounded-3xl text-center shadow-xl border ${result >= 0 ? 'bg-mint/10 border-mint/20' : 'bg-red-50 dark:bg-red-900/10 border-red-100 dark:border-red-900/20'}`}>
                            <span className={`text-[10px] uppercase font-black block mb-1 ${result >= 0 ? 'text-mint' : 'text-red-600 dark:text-red-400'}`}>Tu Patrimonio Neto Actual</span>
                            <div className={`text-4xl font-black ${result >= 0 ? 'text-mint-hover dark:text-mint' : 'text-red-700 dark:text-red-500'}`}>${result.toLocaleString()}</div>
                        </div>
                    )}
                </div>
            )
        }

        function ToolsDashboard({ contentWidth }) {
            const tools = [
                { id: 'emergency', name: 'Fondo Emergencia', icon: 'fa-piggy-bank', color: 'text-yellow-600', component: <EmergencyFund />, info: "Calcula la reserva de dinero necesaria para cubrir imprevistos sin endeudarte." },
                { id: 'hormiga', name: 'Gastos Hormiga', icon: 'fa-search-dollar', color: 'text-purple-500', component: <GastosHormiga />, info: "Identifica pequeños gastos diarios que sumados representan una gran fuga de dinero." },
                { id: 'compound', name: 'Interés Compuesto', icon: 'fa-seedling', color: 'text-emerald-500', component: <CompoundInterest />, info: "Visualiza cómo el tiempo y la reinversión de ganancias multiplican tu capital." },
                { id: 'networth', name: 'Patrimonio Neto', icon: 'fa-balance-scale', color: 'text-navy', component: <NetWorth />, info: "La métrica real de tu riqueza: resta todo lo que debes de todo lo que posees." },
                { id: 'budget', name: 'Presupuesto 50/30/20', icon: 'fa-chart-pie', color: 'text-indigo-500', component: <MonthlyBudget />, info: "Divide tus ingresos en necesidades, deseos y ahorro/inversión de forma equilibrada." },
                { id: 'roi', name: 'Retorno ROI', icon: 'fa-chart-line', color: 'text-blue-500', component: <ROICalculator />, info: "Mide la rentabilidad de una inversión comparando el beneficio obtenido con el costo." },
            ];

            const [activeId, setActiveId] = useState('hormiga');
            const activeTool = tools.find(t => t.id === activeId);

            return (
                <div className="animate-fade-in">
                    <div className="text-center mb-12">
                        <h1 className="text-3xl md:text-4xl font-black text-navy dark:text-white uppercase tracking-tighter mb-4">Calculadoras de Precisión<span className="text-mint">.</span></h1>
                        <p className="text-gray-500 dark:text-gray-400 max-w-xl mx-auto font-medium">Herramientas diseñadas para darte claridad absoluta sobre tus finanzas personales en segundos.</p>
                    </div>

                    <div className="flex flex-col md:flex-row gap-8">
                        {/* Navegación PC (Izquierda) / Móvil (Superior) */}
                        <div className="flex md:flex-col overflow-x-auto md:overflow-x-visible pb-4 md:pb-0 gap-3 scrollbar-hide w-full md:w-80 shrink-0">
                            {tools.map(tool => (
                                <div key={tool.id} className="relative flex-shrink-0 md:w-full group">
                                    <button onClick={() => setActiveId(tool.id)} className={`w-full flex items-center p-4 rounded-2xl transition-all border-2 relative overflow-hidden ${activeId === tool.id ? 'bg-white dark:bg-gray-800 border-mint/30 shadow-2xl scale-[1.03] z-10' : 'bg-white/50 dark:bg-gray-900/50 border-transparent opacity-60 hover:opacity-100'}`}>
                                        {activeId === tool.id && <div className="absolute left-0 bottom-0 md:bottom-auto md:top-0 md:w-1.5 w-full h-1 md:h-full bg-mint shadow-[0_0_15px_rgba(16,185,129,0.8)]"></div>}
                                        <div className="w-10 h-10 rounded-xl flex items-center justify-center bg-gray-50 dark:bg-gray-900 shadow-sm border dark:border-gray-700">
                                            <i className={`fas ${tool.icon} ${tool.color} text-base`}></i>
                                        </div>
                                        <span className="ml-4 font-black text-[11px] text-navy dark:text-white uppercase tracking-tighter whitespace-nowrap">{tool.name}</span>
                                    </button>
                                    
                                    {/* Botón de Información (i) */}
                                    <div className="absolute top-2 right-2 z-20">
                                        <div className="group/info relative">
                                            <button className="w-5 h-5 rounded-full bg-gray-100 dark:bg-gray-700 flex items-center justify-center text-[10px] text-gray-400 hover:bg-mint hover:text-white transition-all">
                                                <i className="fas fa-info"></i>
                                            </button>
                                            <div className="absolute left-full ml-3 top-0 w-48 p-3 bg-navy text-white text-[10px] rounded-xl shadow-2xl opacity-0 group-hover/info:opacity-100 pointer-events-none transition-opacity z-50 font-medium leading-relaxed border border-white/10 backdrop-blur-md">
                                                {tool.info}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>

                        {/* Visor de Herramienta */}
                        <div className="flex-grow bg-white dark:bg-gray-800 p-8 md:p-12 rounded-[3.5rem] shadow-2xl border border-gray-100 dark:border-gray-700 relative overflow-hidden">
                            <div className="absolute top-0 right-0 p-12 opacity-[0.03] pointer-events-none">
                                <i className={`fas ${activeTool.icon} text-[15rem]`}></i>
                            </div>
                            
                            <div className="relative z-10">
                                <div className="mb-10 flex items-center gap-5">
                                    <div className="w-16 h-16 bg-gray-50 dark:bg-gray-900 rounded-2xl flex items-center justify-center shadow-inner border dark:border-gray-800">
                                        <i className={`fas ${activeTool.icon} ${activeTool.color} text-3xl`}></i>
                                    </div>
                                    <div>
                                        <h2 className="text-2xl font-black text-navy dark:text-white uppercase tracking-tighter leading-none mb-1">{activeTool.name}</h2>
                                        <span className="text-[10px] font-black text-mint uppercase tracking-widest">Herramienta Activa</span>
                                    </div>
                                </div>
                                <div className="max-w-xl">
                                    {activeTool.component}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function RegisterModal({ isOpen, onClose, onRegister, darkMode }) {
            if (!isOpen) return null;

            const [formData, setFormData] = React.useState({
                name: '',
                email: '',
                goal: ''
            });
            const [isSubmitting, setIsSubmitting] = React.useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);

                const formToSubmit = new FormData();
                formToSubmit.append('name', formData.name);
                formToSubmit.append('email', formData.email);
                formToSubmit.append('meta_financiera', formData.goal);
                formToSubmit.append('_captcha', 'false');
                formToSubmit.append('_subject', 'Nuevo Registro Prosper');

                try {
                    await fetch('https://formspree.io/f/xlgpoajn', {
                        method: 'POST',
                        body: formToSubmit
                    });
                    localStorage.setItem('userName', formData.name);
                    localStorage.setItem('isLoggedIn', 'true');
                    onRegister(formData.name);
                    onClose();
                } catch (error) {
                    localStorage.setItem('userName', formData.name);
                    localStorage.setItem('isLoggedIn', 'true');
                    onRegister(formData.name);
                    onClose();
                } finally {
                    setIsSubmitting(false);
                }
            };

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-navy/60 backdrop-blur-sm animate-fade-in">
                    <div className={`w-full max-w-md rounded-3xl shadow-2xl overflow-hidden transform transition-all ${darkMode ? 'bg-gray-800 text-white' : 'bg-white text-navy'}`}>
                        <div className="relative p-6 md:p-8">
                            <button onClick={onClose} className="absolute top-4 right-4 text-gray-400 hover:text-mint transition-colors">
                                <i className="fas fa-times text-xl"></i>
                            </button>

                            <div className="text-center mb-8">
                                <div className="bg-mint/10 text-mint w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 transform rotate-3">
                                    <i className="fas fa-user-plus text-2xl"></i>
                                </div>
                                <h2 className="text-2xl font-black">Únete a Prosper.</h2>
                                <p className={`text-sm mt-2 ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Comienza tu camino hacia la libertad financiera.</p>
                            </div>

                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold uppercase tracking-wider mb-1.5 ml-1 opacity-70">Nombre Completo</label>
                                    <input
                                        required
                                        type="text"
                                        placeholder="Ej. Juan Pérez"
                                        className={`w-full p-3.5 rounded-2xl border bg-cream outline-none focus:ring-2 focus:ring-mint/50 transition-all ${darkMode ? 'border-gray-700 bg-gray-900/50' : 'border-gray-100 bg-gray-50'}`}
                                        value={formData.name}
                                        onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold uppercase tracking-wider mb-1.5 ml-1 opacity-70">Correo Electrónico</label>
                                    <input
                                        required
                                        type="email"
                                        placeholder="tu@email.com"
                                        className={`w-full p-3.5 rounded-2xl border bg-cream outline-none focus:ring-2 focus:ring-mint/50 transition-all ${darkMode ? 'border-gray-700 bg-gray-900/50' : 'border-gray-100 bg-gray-50'}`}
                                        value={formData.email}
                                        onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold uppercase tracking-wider mb-1.5 ml-1 opacity-70">Meta Financiera</label>
                                    <textarea
                                        required
                                        placeholder="Ej. Comprar mi primer depa, invertir en la bolsa..."
                                        rows="2"
                                        className={`w-full p-3.5 rounded-2xl border bg-cream outline-none focus:ring-2 focus:ring-mint/50 transition-all ${darkMode ? 'border-gray-700 bg-gray-900/50' : 'border-gray-100 bg-gray-50'}`}
                                        value={formData.goal}
                                        onChange={(e) => setFormData({ ...formData, goal: e.target.value })}
                                    ></textarea>
                                </div>

                                <button
                                    disabled={isSubmitting}
                                    type="submit"
                                    className="w-full bg-gradient-to-r from-[#1E3A8A] to-[#1e40af] text-white font-bold py-4 rounded-2xl shadow-lg shadow-navy/20 transform hover:scale-[1.02] active:scale-95 transition-all mt-4 flex items-center justify-center"
                                >
                                    {isSubmitting ? (
                                        <i className="fas fa-circle-notch fa-spin mr-2"></i>
                                    ) : (
                                        <i className="fas fa-paper-plane mr-2"></i>
                                    )}
                                    {isSubmitting ? 'Enviando...' : 'Empezar ahora'}
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [showRegisterModal, setShowRegisterModal] = useState(false);
            const [isLoggedIn, setIsLoggedIn] = useState(() => localStorage.getItem('isLoggedIn') === 'true');
            const [userName, setUserName] = useState(() => localStorage.getItem('userName') || '');
            const [contentWidth, setContentWidth] = useState(() => localStorage.getItem('contentWidth') || 'max-w-6xl');
            const [darkMode, setDarkMode] = useState(() => {
                const saved = localStorage.getItem('darkMode');
                if (saved !== null) return saved === 'true';
                return window.matchMedia('(prefers-color-scheme: dark)').matches;
            });

            React.useEffect(() => {
                localStorage.setItem('contentWidth', contentWidth);
            }, [contentWidth]);

            React.useEffect(() => {
                localStorage.setItem('isLoggedIn', isLoggedIn);
            }, [isLoggedIn]);

            React.useEffect(() => {
                const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
                const handleChange = (e) => {
                    setDarkMode(e.matches);
                };
                mediaQuery.addEventListener('change', handleChange);
                return () => mediaQuery.removeEventListener('change', handleChange);
            }, []);

            React.useEffect(() => {
                localStorage.setItem('darkMode', darkMode);
                localStorage.setItem('darkMode', darkMode);
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [darkMode]);

            const handleRegister = (name) => {
                setUserName(name);
                setIsLoggedIn(true);
            };

            const toggleUserMenu = () => {
                setMobileMenuOpen(!mobileMenuOpen);
            };

            return (
                <div className={`min-h-screen flex flex-col ${darkMode ? 'dark' : ''}`}>
                    <header className={`backdrop-blur-md shadow-sm sticky top-0 z-50 border-b pb-safe-top transition-colors duration-300 ${darkMode ? 'bg-gray-900/90 border-gray-800 text-white' : 'bg-white/90 border-gray-100 text-gray-800'}`}>
                        <div className={`mx-auto px-4 sm:px-6 lg:px-8 transition-all duration-500 ${contentWidth}`}>
                            <div className="flex justify-between h-16 md:h-20 items-center">
                                <div className="flex items-center cursor-pointer" onClick={() => window.location.href = 'index.html'}>
                                    <div className="bg-mint text-white p-2 rounded-xl mr-3 shadow-md transform rotate-3">
                                        <i className="fas fa-chart-line text-lg"></i>
                                    </div>
                                    <span className={`font-black text-2xl tracking-tight transition-colors ${darkMode ? 'text-white' : 'text-navy'}`}>Prosper<span className="text-mint">.</span></span>
                                </div>

                                <nav className="hidden md:flex space-x-10 items-center h-full">
                                    <a href="index.html" className="nav-line-neon h-full flex items-center text-gray-400 dark:text-gray-500 hover:text-navy dark:hover:text-white font-black uppercase text-xs tracking-widest px-1 py-1 smooth-transition">Inicio</a>
                                    <a href="aprende.html" className="nav-line-neon h-full flex items-center text-gray-400 dark:text-gray-500 hover:text-navy dark:hover:text-white font-black uppercase text-xs tracking-widest px-1 py-1 smooth-transition">Aprende</a>
                                    <a href="tools.html" className="nav-line-neon active h-full flex items-center font-black uppercase text-xs tracking-widest px-1 py-1">Herramientas</a>
                                    <a href="quiz.html" className="nav-line-neon h-full flex items-center text-gray-400 dark:text-gray-500 hover:text-navy dark:hover:text-white font-black uppercase text-xs tracking-widest px-1 py-1 smooth-transition">Quiz</a>
                                    <a href="route.html" className="nav-line-neon h-full flex items-center text-gray-400 dark:text-gray-500 hover:text-navy dark:hover:text-white font-black uppercase text-xs tracking-widest px-1 py-1 smooth-transition">Mis Retos</a>
                                </nav>

                                <div className="flex items-center">
                                    <button onClick={toggleUserMenu} className={`p-2 rounded-xl smooth-transition focus:outline-none flex items-center w-10 h-10 justify-center ${darkMode ? 'bg-gray-800 text-white hover:bg-gray-700' : 'bg-gray-50 text-navy hover:bg-gray-100'}`}>
                                        <i className={`fas ${mobileMenuOpen ? 'fa-times' : (isLoggedIn ? 'fa-user-check text-mint' : 'fa-user')} text-xl text-center flex items-center`}></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        {mobileMenuOpen && (
                            <div className={`absolute right-4 top-16 md:right-8 md:top-20 w-64 shadow-2xl z-50 animate-fade-in rounded-2xl overflow-hidden origin-top-right border ${darkMode ? 'bg-gray-800 border-gray-700 text-white' : 'bg-white border-gray-100 text-gray-800'}`}>
                                <div className="p-3 space-y-1">
                                    <div className={`px-3 py-3 border-b mb-2 ${darkMode ? 'border-gray-700' : 'border-gray-100'}`}>
                                        <p className="text-sm font-bold">{isLoggedIn ? userName : 'Invitado'}</p>
                                        <p className="text-xs opacity-70">{isLoggedIn ? 'Usuario Verificado' : 'Sin iniciar sesión'}</p>
                                    </div>

                                    {!isLoggedIn && (
                                        <button onClick={() => { setShowRegisterModal(true); setMobileMenuOpen(false); }} className={`w-full flex items-center px-4 py-3 rounded-xl text-sm font-semibold smooth-transition text-left text-mint ${darkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-50'}`}>
                                            <i className="fas fa-sign-in-alt w-6"></i> Iniciar Sesión
                                        </button>
                                    )}

                                    <a href="acerca.html" onClick={() => setMobileMenuOpen(false)} className={`flex items-center px-4 py-3 rounded-xl text-sm font-semibold smooth-transition ${darkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-50'}`}>
                                        <i className="fas fa-info-circle w-6 text-blue-500"></i> Aprende a usar la app
                                    </a>
                                    <button onClick={() => { setDarkMode(!darkMode); setMobileMenuOpen(false); }} className={`w-full flex items-center justify-between px-4 py-3 rounded-xl text-sm font-semibold smooth-transition text-left ${darkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-50'}`}>
                                        <div className="flex items-center">
                                            <i className={`fas ${darkMode ? 'fa-sun text-yellow-500' : 'fa-moon text-indigo-500'} w-6`}></i>
                                            Tema {darkMode ? 'Claro' : 'Oscuro'}
                                        </div>
                                    </button>
                                    {isLoggedIn && (
                                        <button onClick={() => { localStorage.clear(); window.location.reload(); }} className={`w-full flex items-center px-4 py-3 rounded-xl text-sm font-semibold smooth-transition text-left text-red-500 ${darkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-50'}`}>
                                            <i className="fas fa-sign-out-alt w-6"></i> Cerrar Sesión
                                        </button>
                                    )}

                                    {/* Ajuste de Ancho (PC) */}
                                    <div className="hidden md:block p-4 border-t border-gray-100 dark:border-gray-700">
                                        <p className="text-[10px] font-black text-gray-400 dark:text-gray-500 uppercase tracking-[0.2em] mb-3">Anchura de la web</p>
                                        <div className="flex gap-2 bg-gray-50 dark:bg-gray-900 p-1 rounded-xl">
                                            {[
                                                { id: 'max-w-4xl', label: 'Pequeño' },
                                                { id: 'max-w-6xl', label: 'Mediano' },
                                                { id: 'max-w-[1400px]', label: 'Grande' }
                                            ].map(opt => (
                                                <button 
                                                    key={opt.id}
                                                    onClick={() => setContentWidth(opt.id)}
                                                    className={`flex-1 py-2 text-[9px] font-black uppercase rounded-lg transition-all ${contentWidth === opt.id ? 'bg-mint text-white shadow-md' : 'text-gray-400 hover:text-navy dark:hover:text-white'}`}
                                                >
                                                    {opt.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </header>

                    <main className={`flex-grow mx-auto px-4 sm:px-6 lg:px-8 py-8 md:py-12 pb-24 md:pb-12 transition-all duration-500 animate-fade-in ${contentWidth}`}>
                        <ToolsDashboard />
                    </main>

                    <RegisterModal
                        isOpen={showRegisterModal}
                        onClose={() => setShowRegisterModal(false)}
                        onRegister={handleRegister}
                        darkMode={darkMode}
                    />

                    {/* Bottom Nav para APK/Mobile */}
                    <div className="md:hidden fixed bottom-0 left-0 w-full transition-colors duration-300 backdrop-blur-md border-t z-50 pb-safe shadow-[0_-5px_15px_rgba(0,0,0,0.05)] dark:bg-gray-900/95 dark:border-gray-800 bg-white/95 border-gray-200 bottom-nav-neon-top">
                        <div className="flex justify-around items-end h-16 pb-2 relative">
                            <a href="aprende.html" className="nav-line-neon flex flex-col items-center justify-center w-full text-gray-400 dark:text-gray-500 hover:text-navy dark:hover:text-white smooth-transition h-full pt-1">
                                <i className="fas fa-book-open text-xl mb-1 mt-1"></i>
                                <span className="text-[10px] font-black uppercase">Aprende</span>
                            </a>
                            <a href="quiz.html" className="nav-line-neon flex flex-col items-center justify-center w-full text-gray-400 dark:text-gray-500 hover:text-navy dark:hover:text-white smooth-transition h-full pt-1">
                                <i className="fas fa-bolt text-xl mb-1 mt-1"></i>
                                <span className="text-[10px] font-black uppercase">Quiz</span>
                            </a>

                            {/* Centro (Inicio) más prominente inactivo */}
                            <a href="index.html" className="nav-line-neon flex flex-col items-center justify-center w-full relative z-10 bottom-3">
                                <div className="bg-gray-100 dark:bg-gray-800 text-gray-500 dark:text-gray-500 hover:text-mint dark:hover:text-mint-light w-14 h-14 rounded-full flex items-center justify-center shadow-[0_-2px_10px_rgba(0,0,0,0.05)] border-4 border-white dark:border-gray-900 transform hover:scale-105 smooth-transition">
                                    <i className="fas fa-home text-2xl"></i>
                                </div>
                                <span className="text-[10px] font-black uppercase text-gray-500 dark:text-gray-500 mt-1">Inicio</span>
                            </a>

                            <a href="tools.html" className="flex flex-col items-center justify-center w-full smooth-transition h-full pt-1">
                                <i className="fas fa-tools text-xl mb-1 mt-1 text-mint"></i>
                                <span className="text-[10px] font-black uppercase text-mint active-text-glow">Útiles</span>
                            </a>
                            <a href="route.html" className="nav-line-neon flex flex-col items-center justify-center w-full text-gray-400 dark:text-gray-500 hover:text-navy dark:hover:text-white smooth-transition h-full pt-1">
                                <i className="fas fa-route text-xl mb-1 mt-1"></i>
                                <span className="text-[10px] font-black uppercase">Mis Retos</span>
                            </a>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
