<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Retos - Prosper</title>

    <!-- Preconnect a recursos externos -->
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" defer></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cream: '#FAFAFA',
                        mint: '#10B981',
                        'mint-light': '#D1FAE5',
                        'mint-hover': '#059669',
                        navy: '#1E3A8A',
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    animation: { 'fade-in': 'fadeIn 0.3s ease-in-out' }
                }
            }
        }
    </script>

    <script>
            // Aplicar el modo oscuro inmediatamente para evitar el flash blanco
            (function () {
                const savedMode = localStorage.getItem('darkMode');
                const systemMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const isDark = savedMode === 'true' || (savedMode === null && systemMode);
                if (isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            })();
    </script>

    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1E3A8A">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </noscript>
    <link rel="stylesheet" href="styles.css">
</head>

<body
    class="text-gray-800 antialiased selection:bg-mint-light selection:text-navy bg-cream dark:bg-gray-900 dark:text-white transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const DEFAULT_HABITS = [
            { id: 1, text: "Registrar tus ingresos y gastos de hoy", icon: "fa-pen-to-square", completed: false },
            { id: 2, text: "Llenar el sobre/cuenta de Fondo de Emergencia", icon: "fa-piggy-bank", completed: false },
            { id: 3, text: "Saldar Tarjeta de Crédito al 100% totalero", icon: "fa-credit-card", completed: false },
            { id: 4, text: "Ahorrar 20% del último ingreso según 50/30/20", icon: "fa-chart-pie", completed: false },
            { id: 5, text: "Revisar o hacer tu primera Inversión indexada", icon: "fa-arrow-trend-up", completed: false },
        ];

        // ── Bandera para evitar guardar antes de que Firestore cargue ──────────
        let habitosCargadosDesdeFirestore = false;

        // Función para generar links de Google Calendar (ISO YYYYMMDDTHHMMSSZ)
        function generarLinkCalendario(titulo, descripcion, horasDesdeAhora) {
            const pad = (n) => (n < 10 ? '0' + n : n);
            const toISO = (d) => {
                return (
                    d.getUTCFullYear() +
                    pad(d.getUTCMonth() + 1) +
                    pad(d.getUTCDate()) +
                    'T' +
                    pad(d.getUTCHours()) +
                    pad(d.getUTCMinutes()) +
                    pad(d.getUTCSeconds()) +
                    'Z'
                );
            };

            const start = new Date();
            start.setHours(start.getHours() + horasDesdeAhora);
            const end = new Date(start.getTime() + 60 * 60 * 1000); // 1 hora de duración

            return `https://www.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(titulo)}&details=${encodeURIComponent(descripcion)}&dates=${toISO(start)}/${toISO(end)}`;
        }

        function ProgressTracker() {
            const [habits, setHabits] = useState(() => {
                const saved = localStorage.getItem('user_habits');
                return saved ? JSON.parse(saved) : DEFAULT_HABITS;
            });
            const [newTaskText, setNewTaskText] = useState("");
            const [selectedIcon, setSelectedIcon] = useState("fa-star");
            const [guardando, setGuardando] = useState(false);
            const [statusMsg, setStatusMsg] = useState("");
            const [cargando, setCargando] = useState(true); 

            const AVAILABLE_ICONS = [
                "fa-star", "fa-piggy-bank", "fa-credit-card", "fa-chart-pie", 
                "fa-arrow-trend-up", "fa-wallet", "fa-coins", "fa-vault", 
                "fa-briefcase", "fa-house", "fa-car", "fa-plane"
            ];

            const guardarTimeout = useRef(null);

            // ── Inicializar Firebase: esperar Auth y cargar hábitos ──────────────
            useEffect(() => {
                let unsubscribe = null;
                const esperar = setInterval(() => {
                    if (window._firebaseRuta?.inicializar) {
                        clearInterval(esperar);
                        unsubscribe = window._firebaseRuta.inicializar({
                            onSesion: (usuario) => {
                                if (!usuario) {
                                    setHabits(DEFAULT_HABITS);
                                    localStorage.removeItem('user_habits');
                                    setCargando(false);
                                }
                            },
                            onHabitosListos: (habitosFirestore) => {
                                if (habitosFirestore !== null) {
                                    setHabits(habitosFirestore);
                                    localStorage.setItem('user_habits', JSON.stringify(habitosFirestore));
                                    habitosCargadosDesdeFirestore = true;
                                } else {
                                    setHabits(DEFAULT_HABITS);
                                    localStorage.removeItem('user_habits');
                                    habitosCargadosDesdeFirestore = true;
                                }
                                setCargando(false);
                            }
                        });
                    }
                }, 150);
                return () => {
                    clearInterval(esperar);
                    if (unsubscribe) unsubscribe();
                };
            }, []);

            // ── Guardar en localStorage + Firestore con debounce ─────────────────
            useEffect(() => {
                localStorage.setItem('user_habits', JSON.stringify(habits));
                if (!habitosCargadosDesdeFirestore || !window._firebaseRuta) return;
                clearTimeout(guardarTimeout.current);
                guardarTimeout.current = setTimeout(async () => {
                    setGuardando(true);
                    await window._firebaseRuta.guardarHabitos(habits);
                    setGuardando(false);
                    setStatusMsg("✓ Guardado en la nube");
                    setTimeout(() => setStatusMsg(""), 2500);
                }, 800);
            }, [habits]);

            const toggleHabit = (id) => {
                setHabits(habits.map(h => h.id === id ? { ...h, completed: !h.completed } : h));
            };

            const removeHabit = (id) => {
                setHabits(habits.filter(h => h.id !== id));
            };

            const completedCount = habits.filter(h => h.completed).length;
            const progressPercentage = habits.length > 0 ? Math.round((completedCount / habits.length) * 100) : 0;

            const addHabit = (e) => {
                e.preventDefault();
                if (!newTaskText.trim()) return;
                const newHabit = {
                    id: Date.now(),
                    text: newTaskText,
                    icon: selectedIcon,
                    completed: false
                };
                setHabits([...habits, newHabit]);
                setNewTaskText("");
                setSelectedIcon("fa-star");
            };

            return (
                <div className="max-w-2xl mx-auto space-y-6">
                    <div className="bg-white dark:bg-navy rounded-3xl p-5 md:p-8 shadow-2xl border border-gray-100 dark:border-blue-900 card-hover transition-colors duration-300">
                        <div className="flex items-center justify-between mb-6">
                            <h2 className="text-2xl font-extrabold flex items-center text-navy dark:text-white">
                                <i className="fas fa-flag-checkered text-mint mr-3"></i> Mis Retos Diarios
                            </h2>
                            <span className={`text-xs font-semibold transition-all duration-300 ${guardando ? 'text-mint animate-pulse' : statusMsg ? 'text-mint' : 'text-gray-300'}`}>
                                {guardando ? <span><i className="fas fa-circle-notch fa-spin mr-1"></i>Guardando...</span> : statusMsg}
                            </span>
                        </div>

                        <div className="mb-8 bg-gray-50 dark:bg-blue-900/50 rounded-2xl p-5 border border-gray-100 dark:border-blue-800 shadow-inner">
                            <div className="flex justify-between items-end mb-3">
                                <div>
                                    <span className="text-xs font-bold text-gray-500 dark:text-blue-300 uppercase tracking-widest block mb-1">Tu Progreso Financiero</span>
                                    <span className="text-3xl font-black text-navy dark:text-white">{progressPercentage}%</span>
                                </div>
                                <div className="w-10 h-10 bg-white dark:bg-blue-950 rounded-xl shadow flex items-center justify-center">
                                    <i className={`fas fa-star ${progressPercentage === 100 && habits.length > 0 ? 'text-yellow-400' : 'text-gray-200 dark:text-blue-800'} text-xl`}></i>
                                </div>
                            </div>
                            <div className="w-full bg-gray-200 dark:bg-blue-950 rounded-full h-4 overflow-hidden shadow-inner">
                                <div
                                    className="bg-gradient-to-r from-emerald-400 to-mint h-full rounded-full smooth-transition relative shadow-[0_0_10px_rgba(16,185,129,0.5)]"
                                    style={{ width: `${progressPercentage}%` }}
                                ></div>
                            </div>
                        </div>
                        <div className="mb-8 p-4 bg-gray-50 dark:bg-blue-900/30 rounded-2xl border border-gray-100 dark:border-blue-800">
                            <form onSubmit={addHabit} className="flex flex-col sm:flex-row gap-2 mb-4">
                                <input
                                    type="text"
                                    value={newTaskText}
                                    onChange={(e) => setNewTaskText(e.target.value)}
                                    placeholder="Escribe un nuevo objetivo..."
                                    className="flex-grow bg-white dark:bg-blue-950 border border-gray-200 dark:border-blue-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-mint focus:ring-2 focus:ring-mint/20 text-navy dark:text-white smooth-transition"
                                />
                                <button
                                    type="submit"
                                    className="bg-mint hover:bg-mint-hover text-white px-6 py-3 rounded-xl transition-all active:scale-95 font-bold text-sm shrink-0 shadow-lg shadow-mint/20"
                                >
                                    <i className="fas fa-plus mr-1"></i> Añadir
                                </button>
                            </form>
                            
                            <div className="flex flex-wrap gap-2">
                                <span className="text-[10px] font-black uppercase text-gray-400 dark:text-blue-400 w-full mb-1 ml-1 tracking-widest">Elige un icono:</span>
                                {AVAILABLE_ICONS.map((icon) => (
                                    <button
                                        key={icon}
                                        type="button"
                                        onClick={() => setSelectedIcon(icon)}
                                        className={`w-10 h-10 rounded-lg flex items-center justify-center transition-all ${selectedIcon === icon ? 'bg-mint text-white scale-110 shadow-md ring-2 ring-mint/20' : 'bg-white dark:bg-blue-950 text-gray-400 dark:text-blue-500 hover:bg-gray-100 dark:hover:bg-blue-900 border border-gray-100 dark:border-blue-800'}`}
                                    >
                                        <i className={`fas ${icon}`}></i>
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="space-y-4">
                            {habits.length === 0 ? (
                                <p className="text-center text-gray-400 dark:text-blue-300 py-10 italic">No hay tareas pendientes. ¡Añade una nueva!</p>
                            ) : habits.map((habit) => (
                                <div key={habit.id} className="group relative flex items-center">
                                    <label
                                        className={`flex-grow flex items-center p-4 rounded-xl cursor-pointer smooth-transition border-2 ${habit.completed ? 'bg-mint-light/10 border-mint/50 dark:border-mint/30' : 'bg-gray-50 dark:bg-white/5 hover:bg-white/10 border-transparent'}`}
                                    >
                                        <div className="relative flex items-center justify-center shrink-0">
                                            <input
                                                type="checkbox"
                                                className="w-7 h-7 appearance-none bg-white dark:bg-blue-950 border-2 border-gray-300 dark:border-blue-400 rounded-lg checked:bg-mint checked:border-mint focus:outline-none smooth-transition cursor-pointer"
                                                checked={habit.completed}
                                                onChange={() => toggleHabit(habit.id)}
                                            />
                                            {habit.completed && <i className="fas fa-check absolute text-white text-sm pointer-events-none"></i>}
                                        </div>
                                        <span className="w-8 text-center text-mint mx-3 text-lg opacity-80"><i className={`fas ${habit.icon}`}></i></span>
                                    <span className={`text-base font-semibold tracking-wide smooth-transition flex-grow ${habit.completed ? 'line-through opacity-50 text-gray-500 dark:text-gray-400' : 'text-navy dark:text-white'}`}>
                                            {habit.text}
                                        </span>
                                    </label>
                                    
                                    <div className="flex gap-2 ml-2 shrink-0 md:opacity-0 group-hover:opacity-100 opacity-100 transition-opacity">
                                        {/* Botón de Google Calendar */}
                                        <button
                                            onClick={() => {
                                                const titulo = `Prosper: ${habit.text}`;
                                                const desc = "Recordatorio de mi ruta de aprendizaje financiero en Prosper. No olvides completar el módulo hoy.";
                                                const link = generarLinkCalendario(titulo, desc, 24); // Programar para dentro de 24h
                                                window.open(link, '_blank');
                                            }}
                                            className="w-10 h-10 rounded-xl bg-mint/10 hover:bg-navy text-mint hover:text-white smooth-transition flex items-center justify-center border border-mint/20"
                                            title="Recordatorio en Google Calendar®"
                                        >
                                            <i className="fas fa-calendar-plus text-sm"></i>
                                        </button>

                                        <button
                                            onClick={() => removeHabit(habit.id)}
                                            className="w-10 h-10 rounded-xl bg-red-500/10 hover:bg-red-500 text-red-500 hover:text-white smooth-transition flex items-center justify-center border border-red-500/20"
                                            title="Eliminar tarea"
                                        >
                                            <i className="fas fa-trash-can text-sm"></i>
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>

                        {/* Aviso si no hay sesión iniciada */}
                        <p id="aviso-sin-sesion" className="text-center text-xs text-gray-400 mt-6 hidden">
                            <i className="fas fa-cloud-slash mr-1"></i>
                            Inicia sesión para guardar tu progreso en la nube.
                        </p>
                    </div>
                </div>
            );
        }

        function App() {
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [isLoggedIn, setIsLoggedIn] = useState(() => localStorage.getItem('isLoggedIn') === 'true');
            const [userName, setUserName] = useState(() => localStorage.getItem('userName') || '');
            const [darkMode, setDarkMode] = useState(() => {
                const saved = localStorage.getItem('darkMode');
                if (saved !== null) return saved === 'true';
                return window.matchMedia('(prefers-color-scheme: dark)').matches;
            });

            // Escuchar cambios de auth de Firebase (via window._firebaseRuta)
            useEffect(() => {
                const intervalo = setInterval(() => {
                    if (window._firebaseRuta?.escucharAuth) {
                        clearInterval(intervalo);
                        window._firebaseRuta.escucharAuth((usuario) => {
                            if (usuario) {
                                setIsLoggedIn(true);
                                setUserName(usuario.nombre);
                                localStorage.setItem('isLoggedIn', 'true');
                                localStorage.setItem('userName', usuario.nombre);
                                document.getElementById('aviso-sin-sesion')?.classList.add('hidden');
                            } else {
                                setIsLoggedIn(false);
                                setUserName('');
                                localStorage.setItem('isLoggedIn', 'false');
                                localStorage.removeItem('userName');
                                document.getElementById('aviso-sin-sesion')?.classList.remove('hidden');
                            }
                        });
                    }
                }, 200);
                return () => clearInterval(intervalo);
            }, []);

            useEffect(() => {
                localStorage.setItem('darkMode', darkMode);
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                    document.body.classList.add('bg-gray-900', 'text-white');
                    document.body.classList.remove('bg-cream', 'text-gray-800');
                } else {
                    document.documentElement.classList.remove('dark');
                    document.body.classList.add('bg-cream', 'text-gray-800');
                    document.body.classList.remove('bg-gray-900', 'text-white');
                }
            }, [darkMode]);

            const toggleUserMenu = () => {
                setMobileMenuOpen(!mobileMenuOpen);
            };

            return (
                <div className={`min-h-screen flex flex-col ${darkMode ? 'dark' : ''}`}>
                    <header className={`backdrop-blur-md shadow-sm sticky top-0 z-50 border-b pb-safe-top transition-colors duration-300 ${darkMode ? 'bg-gray-900/90 border-gray-800 text-white' : 'bg-white/90 border-gray-100 text-gray-800'}`}>
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between h-16 md:h-20 items-center">
                                <div className="flex items-center cursor-pointer" onClick={() => window.location.href = 'index.html'}>
                                    <div className="bg-mint text-white p-2 rounded-xl mr-3 shadow-md transform rotate-3">
                                        <i className="fas fa-chart-line text-lg"></i>
                                    </div>
                                    <span className={`font-black text-2xl tracking-tight transition-colors ${darkMode ? 'text-white' : 'text-navy'}`}>Prosper<span className="text-mint">.</span></span>
                                </div>

                                <nav className="hidden md:flex space-x-10 items-center h-full">
                                    <a href="index.html" className="nav-line-neon h-full flex items-center text-gray-400 dark:text-gray-500 hover:text-navy dark:hover:text-white font-black uppercase text-xs tracking-widest px-1 py-1 smooth-transition">Inicio</a>
                                    <a href="aprende.html" className="nav-line-neon h-full flex items-center text-gray-400 dark:text-gray-500 hover:text-navy dark:hover:text-white font-black uppercase text-xs tracking-widest px-1 py-1 smooth-transition">Aprende</a>
                                    <a href="tools.html" className="nav-line-neon h-full flex items-center text-gray-400 dark:text-gray-500 hover:text-navy dark:hover:text-white font-black uppercase text-xs tracking-widest px-1 py-1 smooth-transition">Herramientas</a>
                                    <a href="quiz.html" className="nav-line-neon h-full flex items-center text-gray-400 dark:text-gray-500 hover:text-navy dark:hover:text-white font-black uppercase text-xs tracking-widest px-1 py-1 smooth-transition">Quiz</a>
                                    <a href="route.html" className="nav-line-neon active h-full flex items-center font-black uppercase text-xs tracking-widest px-1 py-1">Mis Retos</a>
                                </nav>

                                <div className="flex items-center">
                                    <button onClick={toggleUserMenu} className={`p-2 rounded-xl smooth-transition focus:outline-none flex items-center w-10 h-10 justify-center ${darkMode ? 'bg-gray-800 text-white hover:bg-gray-700' : 'bg-gray-50 text-navy hover:bg-gray-100'}`}>
                                        <i className={`fas ${mobileMenuOpen ? 'fa-times' : (isLoggedIn ? 'fa-user-check text-mint' : 'fa-user')} text-xl text-center flex items-center`}></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        {mobileMenuOpen && (
                            <div className={`absolute right-4 top-16 md:right-8 md:top-20 w-64 shadow-2xl z-50 animate-fade-in rounded-2xl overflow-hidden origin-top-right border ${darkMode ? 'bg-gray-800 border-gray-700 text-white' : 'bg-white border-gray-100 text-gray-800'}`}>
                                <div className="p-3 space-y-1">
                                    <div className={`px-3 py-3 border-b mb-2 ${darkMode ? 'border-gray-700' : 'border-gray-100'}`}>
                                        <p className="text-sm font-bold">{isLoggedIn ? userName : 'Invitado'}</p>
                                        <p className="text-xs opacity-70">{isLoggedIn ? 'Usuario Verificado ☁️' : 'Sin iniciar sesión'}</p>
                                    </div>

                                    {!isLoggedIn && (
                                        <button onClick={() => { window.abrirModalAuth && window.abrirModalAuth(); setMobileMenuOpen(false); }} className={`w-full flex items-center px-4 py-3 rounded-xl text-sm font-semibold smooth-transition text-left text-mint ${darkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-50'}`}>
                                            <i className="fas fa-sign-in-alt w-6"></i> Iniciar Sesión
                                        </button>
                                    )}

                                    <a href="acerca.html" className={`flex items-center px-4 py-3 rounded-xl text-sm font-semibold smooth-transition ${darkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-50'}`}>
                                        <i className="fas fa-info-circle w-6 text-blue-500"></i> Aprende a usar la app
                                    </a>
                                    <button onClick={() => { setDarkMode(!darkMode); setMobileMenuOpen(false); }} className={`w-full flex items-center justify-between px-4 py-3 rounded-xl text-sm font-semibold smooth-transition text-left ${darkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-50'}`}>
                                        <div className="flex items-center">
                                            <i className={`fas ${darkMode ? 'fa-sun text-yellow-500' : 'fa-moon text-indigo-500'} w-6`}></i>
                                            Tema {darkMode ? 'Claro' : 'Oscuro'}
                                        </div>
                                    </button>
                                    {isLoggedIn && (
                                        <button onClick={() => { window.cerrarSesionFirebase && window.cerrarSesionFirebase(); setMobileMenuOpen(false); }} className={`w-full flex items-center px-4 py-3 rounded-xl text-sm font-semibold smooth-transition text-left text-red-500 ${darkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-50'}`}>
                                            <i className="fas fa-sign-out-alt w-6"></i> Cerrar Sesión
                                        </button>
                                    )}
                                </div>
                            </div>
                        )}
                    </header>

                    <main className="flex-grow max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 md:py-12 pb-24 md:pb-12 w-full">
                        <ProgressTracker />
                    </main>

                    {/* Bottom Nav para APK/Mobile */}
                    <div className="md:hidden fixed bottom-0 left-0 w-full transition-colors duration-300 backdrop-blur-md border-t z-50 pb-safe shadow-[0_-5px_15px_rgba(0,0,0,0.05)] dark:bg-gray-900/95 dark:border-gray-800 bg-white/95 border-gray-200 bottom-nav-neon-top">
                        <div className="flex justify-around items-end h-16 pb-2 relative">
                            <a href="aprende.html" className="flex flex-col items-center justify-center w-full text-gray-400 dark:text-gray-500 hover:text-navy dark:hover:text-white smooth-transition h-full pt-1">
                                <i className="fas fa-book-open text-xl mb-1 mt-1"></i>
                                <span className="text-[10px] font-black uppercase">Aprende</span>
                            </a>
                            <a href="quiz.html" className="flex flex-col items-center justify-center w-full text-gray-400 dark:text-gray-500 hover:text-navy dark:hover:text-white smooth-transition h-full pt-1">
                                <i className="fas fa-bolt text-xl mb-1 mt-1"></i>
                                <span className="text-[10px] font-black uppercase">Quiz</span>
                            </a>

                            <a href="index.html" className="flex flex-col items-center justify-center w-full relative z-10 bottom-3">
                                <div className="bg-gray-100 dark:bg-gray-800 text-gray-500 dark:text-gray-500 hover:text-mint dark:hover:text-mint-light w-14 h-14 rounded-full flex items-center justify-center shadow-[0_-2px_10px_rgba(0,0,0,0.05)] border-4 border-white dark:border-gray-900 transform hover:scale-105 smooth-transition">
                                    <i className="fas fa-home text-2xl"></i>
                                </div>
                                <span className="text-[10px] font-black uppercase text-gray-500 dark:text-gray-500 mt-1">Inicio</span>
                            </a>

                            <a href="tools.html" className="flex flex-col items-center justify-center w-full text-gray-400 dark:text-gray-500 hover:text-navy dark:hover:text-white smooth-transition h-full pt-1">
                                <i className="fas fa-tools text-xl mb-1 mt-1"></i>
                                <span className="text-[10px] font-black uppercase">Útiles</span>
                            </a>
                            <a href="route.html" className="flex flex-col items-center justify-center w-full smooth-transition h-full pt-1">
                                <i className="fas fa-route text-xl mb-1 mt-1 text-mint"></i>
                                <span className="text-[10px] font-black uppercase text-mint active-text-glow">Mis Retos</span>
                            </a>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <!-- ═══════════════════════════════════════════════════════════
         MODAL DE AUTENTICACIÓN FIREBASE (igual que en index.html)
         ════════════════════════════════════════════════════════════ -->
    <div id="modal-auth" style="display:none"
        class="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-navy/60 backdrop-blur-sm">
        <div class="w-full max-w-sm bg-white dark:bg-gray-800 rounded-3xl shadow-2xl overflow-hidden">

            <!-- Cabecera -->
            <div class="relative bg-gradient-to-r from-[#1E3A8A] to-[#1e40af] p-6 text-white text-center">
                <button onclick="window.cerrarModalAuth()"
                    class="absolute top-4 right-4 text-white/60 hover:text-white transition-colors">
                    <i class="fas fa-times text-xl"></i>
                </button>
                <div class="bg-white/15 w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-3">
                    <i class="fas fa-chart-line text-2xl"></i>
                </div>
                <h2 class="text-xl font-black">Prosper<span class="text-mint">.</span></h2>
                <p class="text-xs text-blue-100 mt-1">Inicia sesión para guardar tu progreso</p>
            </div>

            <!-- Tabs -->
            <div class="flex border-b border-gray-100 dark:border-gray-700">
                <button
                    class="auth-tab activo flex-1 py-3 text-sm font-bold text-mint border-b-2 border-mint transition-all"
                    data-target="panel-registro">Crear cuenta</button>
                <button
                    class="auth-tab flex-1 py-3 text-sm font-bold text-gray-400 dark:text-gray-500 border-b-2 border-transparent transition-all"
                    data-target="panel-login">Iniciar sesión</button>
            </div>

            <!-- Panel REGISTRO -->
            <div id="panel-registro" class="auth-panel p-6">
                <form id="form-registro" class="space-y-3" novalidate>
                    <div>
                        <label
                            class="block text-xs font-bold uppercase tracking-wider mb-1 text-gray-500 dark:text-gray-400">Nombre
                            completo</label>
                        <input id="reg-nombre" type="text" required placeholder="Ej. María García" autocomplete="name"
                            class="w-full p-3 rounded-2xl border border-gray-100 dark:border-gray-600 bg-gray-50 dark:bg-gray-900/50 text-gray-800 dark:text-white outline-none focus:ring-2 focus:ring-mint/50 transition-all text-sm">
                    </div>
                    <div>
                        <label
                            class="block text-xs font-bold uppercase tracking-wider mb-1 text-gray-500 dark:text-gray-400">Correo
                            electrónico</label>
                        <input id="reg-email" type="email" required placeholder="tu@correo.com" autocomplete="email"
                            class="w-full p-3 rounded-2xl border border-gray-100 dark:border-gray-600 bg-gray-50 dark:bg-gray-900/50 text-gray-800 dark:text-white outline-none focus:ring-2 focus:ring-mint/50 transition-all text-sm">
                    </div>
                    <div>
                        <label
                            class="block text-xs font-bold uppercase tracking-wider mb-1 text-gray-500 dark:text-gray-400">Contraseña
                            (mín. 6 caracteres)</label>
                        <input id="reg-password" type="password" required placeholder="••••••••"
                            autocomplete="new-password"
                            class="w-full p-3 rounded-2xl border border-gray-100 dark:border-gray-600 bg-gray-50 dark:bg-gray-900/50 text-gray-800 dark:text-white outline-none focus:ring-2 focus:ring-mint/50 transition-all text-sm">
                    </div>
                    <p id="msg-registro" class="auth-mensaje" style="display:none"></p>
                    <button type="submit"
                        class="w-full bg-gradient-to-r from-[#1E3A8A] to-[#1e40af] text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-navy/20 hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-2 text-sm">
                        <i class="fas fa-user-plus"></i> Crear cuenta
                    </button>
                </form>
            </div>

            <!-- Panel LOGIN -->
            <div id="panel-login" class="auth-panel p-6" style="display:none">
                <form id="form-login" class="space-y-3" novalidate>
                    <div>
                        <label
                            class="block text-xs font-bold uppercase tracking-wider mb-1 text-gray-500 dark:text-gray-400">Correo
                            electrónico</label>
                        <input id="login-email" type="email" required placeholder="tu@correo.com" autocomplete="email"
                            class="w-full p-3 rounded-2xl border border-gray-100 dark:border-gray-600 bg-gray-50 dark:bg-gray-900/50 text-gray-800 dark:text-white outline-none focus:ring-2 focus:ring-mint/50 transition-all text-sm">
                    </div>
                    <div>
                        <label
                            class="block text-xs font-bold uppercase tracking-wider mb-1 text-gray-500 dark:text-gray-400">Contraseña</label>
                        <input id="login-password" type="password" required placeholder="••••••••"
                            autocomplete="current-password"
                            class="w-full p-3 rounded-2xl border border-gray-100 dark:border-gray-600 bg-gray-50 dark:bg-gray-900/50 text-gray-800 dark:text-white outline-none focus:ring-2 focus:ring-mint/50 transition-all text-sm">
                    </div>
                    <p id="msg-login" class="auth-mensaje" style="display:none"></p>
                    <button type="submit"
                        class="w-full bg-gradient-to-r from-[#1E3A8A] to-[#1e40af] text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-navy/20 hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-2 text-sm">
                        <i class="fas fa-sign-in-alt"></i> Iniciar sesión
                    </button>
                </form>
            </div>

        </div>
    </div>

    <!-- Estilos del modal -->
    <style>
        .auth-tab.activo {
            color: #10B981;
            border-bottom-color: #10B981;
        }

        .auth-mensaje {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            margin-top: 4px;
        }

        .auth-mensaje.error {
            background: #FEE2E2;
            color: #DC2626;
        }

        .auth-mensaje.exito {
            background: #D1FAE5;
            color: #065F46;
        }
    </style>

    <!-- Firebase Auth (modal) -->
    <script type="module" src="auth-ui.js"></script>
    <!-- Firebase Firestore (hábitos) -->
    <script type="module" src="route-firebase.js"></script>
