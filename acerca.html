<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prosper - Acerca de</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cream: '#FAFAFA',
                        mint: '#10B981',
                        'mint-light': '#D1FAE5',
                        'mint-hover': '#059669',
                        navy: '#1E3A8A',
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    animation: { 'fade-in': 'fadeIn 0.3s ease-in-out' },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(-10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <script>
            // Aplicar el modo oscuro inmediatamente para evitar el flash blanco
            (function () {
                const savedMode = localStorage.getItem('darkMode');
                const systemMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const isDark = savedMode === 'true' || (savedMode === null && systemMode);
                if (isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body
    class="text-gray-800 antialiased selection:bg-mint-light selection:text-navy bg-cream dark:bg-gray-900 dark:text-white transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function AboutContent() {
            return (
                <div className="space-y-6">
                    <div className="bg-navy dark:bg-gray-800 rounded-3xl p-8 shadow-xl text-white relative overflow-hidden transition-colors duration-300">
                        <i className="fas fa-rocket absolute -right-6 -bottom-6 text-blue-900 dark:text-gray-900 opacity-30 text-8xl z-0 transform -rotate-12"></i>
                        <div className="relative z-10">
                            <span className="text-mint font-bold uppercase tracking-widest text-xs mb-2 block animate-fade-in">Acerca de nosotros</span>
                            <h2 className="text-3xl md:text-5xl font-black mb-4 leading-tight animate-fade-in" style={{ animationDelay: '0.1s' }}>
                                La misión de <span className="text-mint">Prosper.</span>
                            </h2>
                            <p className="text-blue-100 dark:text-gray-300 text-lg md:text-xl leading-relaxed max-w-2xl font-medium animate-fade-in" style={{ animationDelay: '0.2s' }}>
                                Convertir la educación financiera en algo sencillo, interactivo y directamente aplicable a la vida diaria. Queremos que tomes el control de tu dinero sin tener que descifrar términos complicados ni aburrirte en el proceso.
                            </p>
                        </div>
                    </div>

                    <div className="bg-white dark:bg-gray-800 rounded-3xl p-6 md:p-8 shadow-sm border border-gray-100 dark:border-gray-700 transition-colors duration-300 animate-fade-in" style={{ animationDelay: '0.3s' }}>
                        <h3 className="text-2xl font-bold text-navy dark:text-white mb-6 border-b border-gray-100 dark:border-gray-700 pb-4">
                            ¿Cómo funciona la App?
                        </h3>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="flex bg-gray-50 dark:bg-gray-700/50 p-5 rounded-2xl border border-gray-100 dark:border-gray-600 transition-colors duration-300 card-hover hover:border-mint/50">
                                <div className="bg-mint-light dark:bg-mint/20 text-mint w-12 h-12 rounded-full flex items-center justify-center shrink-0 mr-4">
                                    <i className="fas fa-book-open text-xl"></i>
                                </div>
                                <div>
                                    <h4 className="font-bold text-navy dark:text-white mb-1 text-lg">Aprende</h4>
                                    <p className="text-gray-600 dark:text-gray-400 text-sm md:text-base leading-relaxed">
                                        Módulos de lectura con conceptos vitales como el ahorro, presupuestos e inversiones, explicados desde cero para cualquier persona.
                                    </p>
                                </div>
                            </div>

                            <div className="flex bg-gray-50 dark:bg-gray-700/50 p-5 rounded-2xl border border-gray-100 dark:border-gray-600 transition-colors duration-300 card-hover hover:border-blue-500/50">
                                <div className="bg-blue-100 dark:bg-blue-900/40 text-blue-600 dark:text-blue-400 w-12 h-12 rounded-full flex items-center justify-center shrink-0 mr-4">
                                    <i className="fas fa-tools text-xl"></i>
                                </div>
                                <div>
                                    <h4 className="font-bold text-navy dark:text-white mb-1 text-lg">Útiles (Herramientas)</h4>
                                    <p className="text-gray-600 dark:text-gray-400 text-sm md:text-base leading-relaxed">
                                        Calculadoras prácticas de finanzas personales. Aquí puedes proyectar tu presupuesto 50/30/20, calcular rendimientos y descubrir tus gastos diarios.
                                    </p>
                                </div>
                            </div>

                            <div className="flex bg-gray-50 dark:bg-gray-700/50 p-5 rounded-2xl border border-gray-100 dark:border-gray-600 transition-colors duration-300 card-hover hover:border-purple-500/50">
                                <div className="bg-purple-100 dark:bg-purple-900/40 text-purple-600 dark:text-purple-400 w-12 h-12 rounded-full flex items-center justify-center shrink-0 mr-4">
                                    <i className="fas fa-bolt text-xl"></i>
                                </div>
                                <div>
                                    <h4 className="font-bold text-navy dark:text-white mb-1 text-lg">Quiz</h4>
                                    <p className="text-gray-600 dark:text-gray-400 text-sm md:text-base leading-relaxed">
                                        Pon a prueba lo que vas aprendiendo a través de preguntas interactivas. Fija tus conocimientos sin presiones y con explicaciones de inmediato.
                                    </p>
                                </div>
                            </div>

                            <div className="flex bg-gray-50 dark:bg-gray-700/50 p-5 rounded-2xl border border-gray-100 dark:border-gray-600 transition-colors duration-300 card-hover hover:border-yellow-500/50">
                                <div className="bg-yellow-100 dark:bg-yellow-900/40 text-yellow-600 dark:text-yellow-400 w-12 h-12 rounded-full flex items-center justify-center shrink-0 mr-4">
                                    <i className="fas fa-route text-xl"></i>
                                </div>
                                <div>
                                    <h4 className="font-bold text-navy dark:text-white mb-1 text-lg">Mi Ruta</h4>
                                    <p className="text-gray-600 dark:text-gray-400 text-sm md:text-base leading-relaxed">
                                        Un tracker de progreso diario enfocado en tus rutinas financieras. Completa tus objetivos y observa tu constancia florecer hacia el 100%.
                                    </p>
                                </div>
                            </div>
                        </div>

                        <div className="mt-8 text-center bg-mint-light/30 dark:bg-gray-700/30 p-8 rounded-2xl border border-mint/20 dark:border-mint/10 animate-pulse-slow">
                            <p className="text-navy dark:text-white font-medium text-lg mb-2 italic">
                                "La mejor inversión que puedes hacer es en ti mismo."
                            </p>
                            <p className="text-mint dark:text-mint-light font-bold text-sm uppercase tracking-widest mt-4">
                                ¡Empieza a prosperar hoy!
                            </p>
                        </div>
                    </div>
                </div>
            )
        }

        function RegisterModal({ isOpen, onClose, onRegister, darkMode }) {
            if (!isOpen) return null;

            const [formData, setFormData] = React.useState({
                name: '',
                email: '',
                goal: ''
            });
            const [isSubmitting, setIsSubmitting] = React.useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);

                const formToSubmit = new FormData();
                formToSubmit.append('name', formData.name);
                formToSubmit.append('email', formData.email);
                formToSubmit.append('meta_financiera', formData.goal);
                formToSubmit.append('_captcha', 'false');
                formToSubmit.append('_subject', 'Nuevo Registro Prosper');

                try {
                    await fetch('https://formspree.io/f/xlgpoajn', {
                        method: 'POST',
                        body: formToSubmit
                    });
                    localStorage.setItem('userName', formData.name);
                    localStorage.setItem('isLoggedIn', 'true');
                    onRegister(formData.name);
                    onClose();
                } catch (error) {
                    localStorage.setItem('userName', formData.name);
                    localStorage.setItem('isLoggedIn', 'true');
                    onRegister(formData.name);
                    onClose();
                } finally {
                    setIsSubmitting(false);
                }
            };

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-navy/60 backdrop-blur-sm animate-fade-in">
                    <div className={`w-full max-w-md rounded-3xl shadow-2xl overflow-hidden transform transition-all ${darkMode ? 'bg-gray-800 text-white' : 'bg-white text-navy'}`}>
                        <div className="relative p-6 md:p-8">
                            <button onClick={onClose} className="absolute top-4 right-4 text-gray-400 hover:text-mint transition-colors">
                                <i className="fas fa-times text-xl"></i>
                            </button>

                            <div className="text-center mb-8">
                                <div className="bg-mint/10 text-mint w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 transform rotate-3">
                                    <i className="fas fa-user-plus text-2xl"></i>
                                </div>
                                <h2 className="text-2xl font-black">Únete a Prosper.</h2>
                                <p className={`text-sm mt-2 ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Comienza tu camino hacia la libertad financiera.</p>
                            </div>

                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold uppercase tracking-wider mb-1.5 ml-1 opacity-70">Nombre Completo</label>
                                    <input
                                        required
                                        type="text"
                                        placeholder="Ej. Juan Pérez"
                                        className={`w-full p-3.5 rounded-2xl border bg-cream outline-none focus:ring-2 focus:ring-mint/50 transition-all ${darkMode ? 'border-gray-700 bg-gray-900/50' : 'border-gray-100 bg-gray-50'}`}
                                        value={formData.name}
                                        onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold uppercase tracking-wider mb-1.5 ml-1 opacity-70">Correo Electrónico</label>
                                    <input
                                        required
                                        type="email"
                                        placeholder="tu@email.com"
                                        className={`w-full p-3.5 rounded-2xl border bg-cream outline-none focus:ring-2 focus:ring-mint/50 transition-all ${darkMode ? 'border-gray-700 bg-gray-900/50' : 'border-gray-100 bg-gray-50'}`}
                                        value={formData.email}
                                        onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold uppercase tracking-wider mb-1.5 ml-1 opacity-70">Meta Financiera</label>
                                    <textarea
                                        required
                                        placeholder="Ej. Comprar mi primer departamento, invertir en la bolsa..."
                                        rows="2"
                                        className={`w-full p-3.5 rounded-2xl border bg-cream outline-none focus:ring-2 focus:ring-mint/50 transition-all ${darkMode ? 'border-gray-700 bg-gray-900/50' : 'border-gray-100 bg-gray-50'}`}
                                        value={formData.goal}
                                        onChange={(e) => setFormData({ ...formData, goal: e.target.value })}
                                    ></textarea>
                                </div>

                                <button
                                    disabled={isSubmitting}
                                    type="submit"
                                    className="w-full bg-gradient-to-r from-[#1E3A8A] to-[#1e40af] text-white font-bold py-4 rounded-2xl shadow-lg shadow-navy/20 transform hover:scale-[1.02] active:scale-95 transition-all mt-4 flex items-center justify-center"
                                >
                                    {isSubmitting ? (
                                        <i className="fas fa-circle-notch fa-spin mr-2"></i>
                                    ) : (
                                        <i className="fas fa-paper-plane mr-2"></i>
                                    )}
                                    {isSubmitting ? 'Enviando...' : 'Empezar ahora'}
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [showRegisterModal, setShowRegisterModal] = useState(false);
            const [isLoggedIn, setIsLoggedIn] = useState(() => localStorage.getItem('isLoggedIn') === 'true');
            const [userName, setUserName] = useState(() => localStorage.getItem('userName') || '');
            const [darkMode, setDarkMode] = useState(() => {
                const saved = localStorage.getItem('darkMode');
                if (saved !== null) return saved === 'true';
                return window.matchMedia('(prefers-color-scheme: dark)').matches;
            });

            React.useEffect(() => {
                localStorage.setItem('isLoggedIn', isLoggedIn);
            }, [isLoggedIn]);

            React.useEffect(() => {
                const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
                const handleChange = (e) => {
                    setDarkMode(e.matches);
                };
                mediaQuery.addEventListener('change', handleChange);
                return () => mediaQuery.removeEventListener('change', handleChange);
            }, []);

            React.useEffect(() => {
                localStorage.setItem('darkMode', darkMode);
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                    document.body.classList.add('bg-gray-900', 'text-white');
                    document.body.classList.remove('bg-cream', 'text-gray-800');
                } else {
                    document.documentElement.classList.remove('dark');
                    document.body.classList.add('bg-cream', 'text-gray-800');
                    document.body.classList.remove('bg-gray-900', 'text-white');
                }
            }, [darkMode]);

            const handleRegister = (name) => {
                setUserName(name);
                setIsLoggedIn(true);
            };

            const toggleUserMenu = () => {
                setMobileMenuOpen(!mobileMenuOpen);
            };

            return (
                <div className={`min-h-screen flex flex-col ${darkMode ? 'dark' : ''}`}>
                    <header className={`backdrop-blur-md shadow-sm sticky top-0 z-50 border-b pb-safe-top transition-colors duration-300 ${darkMode ? 'bg-gray-900/90 border-gray-800 text-white' : 'bg-white/90 border-gray-100 text-gray-800'}`}>
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between h-16 md:h-20 items-center">
                                <div className="flex items-center cursor-pointer" onClick={() => window.location.href = 'index.html'}>
                                    <div className="bg-mint text-white p-2 rounded-xl mr-3 shadow-md transform rotate-3">
                                        <i className="fas fa-chart-line text-lg"></i>
                                    </div>
                                    <span className={`font-black text-2xl tracking-tight transition-colors ${darkMode ? 'text-white' : 'text-navy'}`}>Prosper<span className="text-mint">.</span></span>
                                </div>

                                <nav className="hidden md:flex space-x-8 items-center h-full">
                                    <a href="index.html" className="h-full flex items-center text-gray-500 hover:text-navy hover:border-b-4 hover:border-gray-300 border-b-4 border-transparent font-semibold px-1 py-1 smooth-transition">Inicio</a>
                                    <a href="aprende.html" className="h-full flex items-center text-gray-500 hover:text-navy hover:border-b-4 hover:border-gray-300 border-b-4 border-transparent font-semibold px-1 py-1 smooth-transition">Aprende</a>
                                    <a href="tools.html" className="h-full flex items-center text-gray-500 hover:text-navy hover:border-b-4 hover:border-gray-300 border-b-4 border-transparent font-semibold px-1 py-1 smooth-transition">Herramientas</a>
                                    <a href="quiz.html" className="h-full flex items-center text-gray-500 hover:text-navy hover:border-b-4 hover:border-gray-300 border-b-4 border-transparent font-semibold px-1 py-1 smooth-transition">Quiz</a>
                                    <a href="route.html" className="h-full flex items-center text-gray-500 hover:text-navy hover:border-b-4 hover:border-gray-300 border-b-4 border-transparent font-semibold px-1 py-1 smooth-transition">Mi Ruta</a>
                                </nav>

                                <div className="flex items-center">
                                    <button onClick={toggleUserMenu} className={`p-2 rounded-xl smooth-transition focus:outline-none flex items-center w-10 h-10 justify-center ${darkMode ? 'bg-gray-800 text-white hover:bg-gray-700' : 'bg-gray-50 text-navy hover:bg-gray-100'}`}>
                                        <i className={`fas ${mobileMenuOpen ? 'fa-times' : (isLoggedIn ? 'fa-user-check text-mint' : 'fa-user')} text-xl text-center flex items-center`}></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        {mobileMenuOpen && (
                            <div className={`absolute right-4 top-16 md:right-8 md:top-20 w-64 shadow-2xl z-50 animate-fade-in rounded-2xl overflow-hidden origin-top-right border ${darkMode ? 'bg-gray-800 border-gray-700 text-white' : 'bg-white border-gray-100 text-gray-800'}`}>
                                <div className="p-3 space-y-1">
                                    <div className={`px-3 py-3 border-b mb-2 ${darkMode ? 'border-gray-700' : 'border-gray-100'}`}>
                                        <p className="text-sm font-bold">{isLoggedIn ? userName : 'Invitado'}</p>
                                        <p className="text-xs opacity-70">{isLoggedIn ? 'Usuario Verificado' : 'Sin iniciar sesión'}</p>
                                    </div>

                                    {!isLoggedIn && (
                                        <button onClick={() => { setShowRegisterModal(true); setMobileMenuOpen(false); }} className={`w-full flex items-center px-4 py-3 rounded-xl text-sm font-semibold smooth-transition text-left text-mint ${darkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-50'}`}>
                                            <i className="fas fa-sign-in-alt w-6"></i> Iniciar Sesión
                                        </button>
                                    )}

                                    <a href="acerca.html" className={`flex items-center px-4 py-3 rounded-xl text-sm font-semibold smooth-transition ${darkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-50'}`}>
                                        <i className="fas fa-info-circle w-6 text-blue-500"></i> Acerca de
                                    </a>
                                    <button onClick={() => { setDarkMode(!darkMode); setMobileMenuOpen(false); }} className={`w-full flex items-center justify-between px-4 py-3 rounded-xl text-sm font-semibold smooth-transition text-left ${darkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-50'}`}>
                                        <div className="flex items-center">
                                            <i className={`fas ${darkMode ? 'fa-sun text-yellow-500' : 'fa-moon text-indigo-500'} w-6`}></i>
                                            Tema {darkMode ? 'Claro' : 'Oscuro'}
                                        </div>
                                    </button>
                                    {isLoggedIn && (
                                        <button onClick={() => { localStorage.clear(); window.location.reload(); }} className={`w-full flex items-center px-4 py-3 rounded-xl text-sm font-semibold smooth-transition text-left text-red-500 ${darkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-50'}`}>
                                            <i className="fas fa-sign-out-alt w-6"></i> Cerrar Sesión
                                        </button>
                                    )}
                                </div>
                            </div>
                        )}
                    </header>

                    <main className="flex-grow max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 md:py-12 w-full">
                        <AboutContent />
                    </main>

                    <RegisterModal
                        isOpen={showRegisterModal}
                        onClose={() => setShowRegisterModal(false)}
                        onRegister={handleRegister}
                        darkMode={darkMode}
                    />

                    {/* Bottom Nav para APK/Mobile */}
                    <div className="md:hidden fixed bottom-0 left-0 w-full transition-colors duration-300 backdrop-blur-md border-t z-50 pb-safe shadow-[0_-5px_15px_rgba(0,0,0,0.05)] dark:bg-gray-900/95 dark:border-gray-800 bg-white/95 border-gray-200">
                        <div className="flex justify-around items-end h-16 pb-2 relative">
                            <a href="aprende.html" className="flex flex-col items-center justify-center w-full dark:text-gray-500 text-gray-500 dark:hover:text-white hover:text-navy smooth-transition h-full border-t-2 border-transparent pt-1">
                                <i className="fas fa-book-open text-xl mb-1 mt-1"></i>
                                <span className="text-[10px] font-semibold">Aprende</span>
                            </a>
                            <a href="quiz.html" className="flex flex-col items-center justify-center w-full dark:text-gray-500 text-gray-500 dark:hover:text-white hover:text-navy smooth-transition h-full border-t-2 border-transparent pt-1">
                                <i className="fas fa-bolt text-xl mb-1 mt-1"></i>
                                <span className="text-[10px] font-semibold">Quiz</span>
                            </a>

                            <a href="index.html" className="flex flex-col items-center justify-center w-full relative z-10 bottom-3">
                                <div className="bg-gray-100 dark:bg-gray-800 text-gray-500 dark:text-gray-500 hover:text-mint dark:hover:text-mint-light w-14 h-14 rounded-full flex items-center justify-center shadow-[0_-2px_10px_rgba(0,0,0,0.05)] border-4 border-white dark:border-gray-900 transform hover:scale-105 smooth-transition">
                                    <i className="fas fa-home text-2xl"></i>
                                </div>
                                <span className="text-[10px] font-semibold text-gray-500 dark:text-gray-500 mt-1">Inicio</span>
                            </a>

                            <a href="tools.html" className="flex flex-col items-center justify-center w-full dark:text-gray-500 text-gray-500 dark:hover:text-white hover:text-navy smooth-transition h-full border-t-2 border-transparent pt-1">
                                <i className="fas fa-tools text-xl mb-1 mt-1"></i>
                                <span className="text-[10px] font-semibold">Útiles</span>
                            </a>
                            <a href="route.html" className="flex flex-col items-center justify-center w-full dark:text-gray-500 text-gray-500 dark:hover:text-white hover:text-navy smooth-transition h-full border-t-2 border-transparent pt-1">
                                <i className="fas fa-route text-xl mb-1 mt-1"></i>
                                <span className="text-[10px] font-semibold">Mi Ruta</span>
                            </a>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
