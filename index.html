<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prosper - Inicio</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cream: '#FAFAFA',
                        mint: '#10B981',
                        'mint-light': '#D1FAE5',
                        'mint-hover': '#059669',
                        navy: '#1E3A8A',
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-in-out',
                        'float': 'float 3s ease-in-out infinite',
                        'marquee': 'marquee 30s linear infinite'
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(-10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-5px)' },
                        },
                        marquee: {
                            '0%': { transform: 'translateX(0%)' },
                            '100%': { transform: 'translateX(-50%)' },
                        }
                    }
                }
            }
        }
    </script>
    <script>
            // Aplicar el modo oscuro inmediatamente para evitar el flash blanco
            (function () {
                const savedMode = localStorage.getItem('darkMode');
                const systemMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const isDark = savedMode === 'true' || (savedMode === null && systemMode);
                if (isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body
    class="text-gray-800 antialiased selection:bg-mint-light selection:text-navy bg-cream dark:bg-gray-900 dark:text-white transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function NewsSlider() {
            const newsItems = [
                { title: "Regla del 50/30/20", desc: "El mejor presupuesto para tus finanzas en automático.", icon: "fa-chart-pie", color: "text-blue-500", bg: "bg-blue-50" },
                { title: "Fondo de Emergencia", desc: "Ahorra 3 a 6 meses de gastos ante imprevistos.", icon: "fa-piggy-bank", color: "text-mint", bg: "bg-mint-light" },
                { title: "Tarjetas de Crédito", desc: "¿El secreto? Sé 'totalero' antes del corte.", icon: "fa-credit-card", color: "text-purple-500", bg: "bg-purple-50" },
                { title: "Interés Compuesto", desc: "El efecto que multiplica tus inversiones.", icon: "fa-chart-line", color: "text-yellow-500", bg: "bg-yellow-50" }
            ];

            const [currentIndex, setCurrentIndex] = useState(0);

            const nextSlide = () => {
                setCurrentIndex((prev) => (prev + 1) % newsItems.length);
            };

            const prevSlide = () => {
                setCurrentIndex((prev) => (prev - 1 + newsItems.length) % newsItems.length);
            };

            const item = newsItems[currentIndex];

            return (
                <div className="mb-8 w-full">
                    <div className="bg-white dark:bg-gray-800 rounded-3xl p-4 md:p-6 shadow-sm border border-gray-100 dark:border-gray-700 relative items-center justify-between flex flex-col group min-h-[160px] transition-colors duration-300">

                        <div className="flex items-center justify-between w-full flex-grow">
                            <button onClick={prevSlide} className="w-10 h-10 rounded-full hover:bg-gray-50 dark:hover:bg-gray-700 flex items-center justify-center text-gray-400 dark:text-gray-500 hover:text-mint smooth-transition z-10 focus:outline-none shrink-0">
                                <i className="fas fa-chevron-left text-lg"></i>
                            </button>

                            <div className="flex-1 px-2 md:px-4 text-center cursor-pointer animate-fade-in" onClick={() => window.location.href = 'aprende.html'}>
                                <div className={`w-10 h-10 md:w-12 md:h-12 ${item.bg} rounded-full mx-auto flex items-center justify-center mb-2 md:mb-3 shadow-sm`}>
                                    <i className={`fas ${item.icon} ${item.color} text-lg md:text-xl`}></i>
                                </div>
                                <h3 className="font-extrabold text-navy dark:text-white text-sm md:text-lg mb-1 tracking-tight">{item.title}</h3>
                                <p className="text-gray-600 dark:text-gray-400 text-xs md:text-sm font-medium line-clamp-2 md:line-clamp-none">{item.desc}</p>
                            </div>

                            <button onClick={nextSlide} className="w-10 h-10 rounded-full hover:bg-gray-50 dark:hover:bg-gray-700 flex items-center justify-center text-gray-400 dark:text-gray-500 hover:text-mint smooth-transition z-10 focus:outline-none shrink-0">
                                <i className="fas fa-chevron-right text-lg"></i>
                            </button>
                        </div>

                        <div className="flex justify-center space-x-2 mt-4">
                            {newsItems.map((_, idx) => (
                                <button
                                    key={idx}
                                    onClick={() => setCurrentIndex(idx)}
                                    className={`h-2 rounded-full smooth-transition ${idx === currentIndex ? 'w-6 bg-mint' : 'w-2 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600'}`}
                                ></button>
                            ))}
                        </div>

                    </div>
                </div>
            );
        }

        function CircleMenu() {
            const menuItems = [
                { id: "hormiga", title: "Gastos", icon: "fa-search-dollar", bg: "bg-mint-light", color: "text-mint", href: "tools.html?tool=hormiga" },
                { id: "budget", title: "50/30/20", icon: "fa-chart-pie", bg: "bg-purple-100", color: "text-purple-600", href: "tools.html?tool=budget" },
                { id: "roi", title: "ROI", icon: "fa-chart-line", bg: "bg-blue-100", color: "text-blue-600", href: "tools.html?tool=roi" },
                { id: "compound", title: "Interés", icon: "fa-seedling", bg: "bg-emerald-100", color: "text-emerald-600", href: "tools.html?tool=compound" },
                { id: "emergency", title: "Fondo", icon: "fa-piggy-bank", bg: "bg-yellow-100", color: "text-yellow-600", href: "tools.html?tool=emergency" },
                { id: "networth", title: "Patrimonio", icon: "fa-scale-balanced", bg: "bg-indigo-100", color: "text-indigo-600", href: "tools.html?tool=networth" }
            ];

            return (
                <div className="mb-10 w-full animate-fade-in">
                    <div className="flex justify-between items-center mb-3 px-2">
                        <span className="text-sm font-bold text-navy dark:text-white transition-colors">Herramientas Rápidas</span>
                        <a href="tools.html" className="text-xs font-bold text-mint hover:text-mint-hover smooth-transition">Ver todas &gt;</a>
                    </div>
                    <div className="flex overflow-x-auto gap-4 pb-4 px-2 snap-x snap-mandatory [&::-webkit-scrollbar]:hidden" style={{ scrollbarWidth: 'none', msOverflowStyle: 'none' }}>
                        {menuItems.map((item, index) => (
                            <a key={index} href={item.href} className="flex flex-col items-center group cursor-pointer w-20 shrink-0 snap-start">
                                <div className={`w-14 h-14 md:w-16 md:h-16 rounded-full ${item.bg} flex items-center justify-center mb-2 transform group-hover:scale-110 smooth-transition shadow-sm border border-white dark:border-gray-800`}>
                                    <i className={`fas ${item.icon} ${item.color} text-xl md:text-2xl`}></i>
                                </div>
                                <span className="text-[11px] md:text-xs font-bold text-gray-600 dark:text-gray-400 group-hover:text-navy dark:group-hover:text-white smooth-transition text-center">{item.title}</span>
                            </a>
                        ))}
                    </div>
                </div>
            );
        }

        function Dashboard() {
            const tips = [
                {
                    title: "El Poder del Inicio Temprano",
                    desc: "Por qué empezar a los 20 es tu mayor ventaja financiera.",
                    icon: "fa-seedling",
                    color: "text-mint-light",
                    bg: "from-[#1E3A8A] to-[#1e40af]",
                    url: "aprende.html?article=11",
                    fullWidth: false
                },
                {
                    title: "ETFs: Diversión Simple",
                    desc: "Cómo comprar cientos de acciones con muy poco capital.",
                    icon: "fa-layer-group",
                    color: "text-orange-500",
                    bg: "bg-white dark:bg-gray-800",
                    url: "aprende.html?article=12",
                    fullWidth: false
                },
                {
                    title: "Ahorro vs Inversión",
                    desc: "La clave para que tu dinero no pierda valor con el tiempo.",
                    icon: "fa-right-left",
                    color: "text-mint-hover",
                    bg: "bg-white dark:bg-gray-800",
                    url: "aprende.html?article=13",
                    fullWidth: false
                },
                {
                    title: "Tu Mejor Inversión",
                    desc: "Por qué educarte financieramente paga los mejores intereses.",
                    icon: "fa-user-graduate",
                    color: "text-mint",
                    bg: "from-gray-900 to-navy",
                    url: "aprende.html?article=14",
                    fullWidth: false
                }
            ];

            return (
                <div className="space-y-4 animate-fade-in max-w-2xl mx-auto">

                    <NewsSlider />

                    <CircleMenu />

                    <div className="grid grid-cols-2 gap-4 md:gap-6">
                        {tips.map((item, idx) => (
                            <a
                                key={idx}
                                href={item.url}
                                className={`group rounded-3xl p-5 md:p-6 shadow-lg card-hover relative overflow-hidden flex flex-col justify-between aspect-[1/1.1] md:aspect-auto md:min-h-[200px] transition-all duration-300 ${item.bg} ${item.bg.includes('from-') ? 'bg-gradient-to-br text-white' : 'border border-gray-100 dark:border-gray-700 text-navy dark:text-white'}`}
                            >
                                <div className="absolute top-0 right-0 w-32 h-32 bg-white/5 rounded-full -translate-y-8 translate-x-8 blur-2xl group-hover:bg-white/10 transition-all duration-500"></div>

                                <div className="relative z-10 flex justify-between items-start">
                                    <div className={`w-10 h-10 md:w-12 md:h-12 rounded-xl flex items-center justify-center backdrop-blur-sm border transform group-hover:scale-110 group-hover:rotate-3 transition-all duration-300 ${item.bg.includes('from-') ? 'bg-white/10 border-white/20' : 'bg-gray-50 dark:bg-gray-700 border-gray-100 dark:border-gray-600'}`}>
                                        <i className={`fas ${item.icon} text-xl md:text-2xl ${item.color}`}></i>
                                    </div>
                                    <i className="fas fa-chevron-right text-[10px] opacity-30"></i>
                                </div>

                                <div className="relative z-10 mt-auto pt-4">
                                    <h3 className="text-lg md:text-xl font-extrabold tracking-tight leading-tight">{item.title}</h3>
                                    <p className={`text-xs md:sm font-medium leading-relaxed mt-1 line-clamp-2 ${item.bg.includes('from-') ? 'text-blue-100/90' : 'text-gray-600 dark:text-gray-400'}`}>
                                        {item.desc}
                                    </p>
                                </div>
                            </a>
                        ))}
                    </div>
                </div>
            );
        }

        function RegisterModal({ isOpen, onClose, onRegister, darkMode }) {
            if (!isOpen) return null;

            const [formData, setFormData] = React.useState({
                name: '',
                email: '',
                goal: ''
            });
            const [isSubmitting, setIsSubmitting] = React.useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);

                // Preparar datos para FormSubmit
                const formToSubmit = new FormData();
                formToSubmit.append('name', formData.name);
                formToSubmit.append('email', formData.email);
                formToSubmit.append('meta_financiera', formData.goal);
                formToSubmit.append('_captcha', 'false'); // Deshabilitar captcha para ajax
                formToSubmit.append('_subject', 'Nuevo Registro Prosper');

                try {
                    // Enviar a FormSubmit (usando ajax para no recargar la página)
                    await fetch('https://formspree.io/f/xlgpoajn', {
                        method: 'POST',
                        body: formToSubmit
                    });

                    // Persistencia local
                    localStorage.setItem('userName', formData.name);
                    localStorage.setItem('isLoggedIn', 'true');

                    onRegister(formData.name);
                    onClose();
                } catch (error) {
                    console.error('Error al enviar el formulario:', error);
                    // Aún así registramos localmente para la demo
                    localStorage.setItem('userName', formData.name);
                    localStorage.setItem('isLoggedIn', 'true');
                    onRegister(formData.name);
                    onClose();
                } finally {
                    setIsSubmitting(false);
                }
            };

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-navy/60 backdrop-blur-sm animate-fade-in">
                    <div className={`w-full max-w-md rounded-3xl shadow-2xl overflow-hidden transform transition-all ${darkMode ? 'bg-gray-800 text-white' : 'bg-white text-navy'}`}>
                        <div className="relative p-6 md:p-8">
                            <button onClick={onClose} className="absolute top-4 right-4 text-gray-400 hover:text-mint transition-colors">
                                <i className="fas fa-times text-xl"></i>
                            </button>

                            <div className="text-center mb-8">
                                <div className="bg-mint/10 text-mint w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 transform rotate-3">
                                    <i className="fas fa-user-plus text-2xl"></i>
                                </div>
                                <h2 className="text-2xl font-black">Únete a Prosper.</h2>
                                <p className={`text-sm mt-2 ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Comienza tu camino hacia la libertad financiera.</p>
                            </div>

                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold uppercase tracking-wider mb-1.5 ml-1 opacity-70">Nombre Completo</label>
                                    <input
                                        required
                                        type="text"
                                        placeholder="Ej. Juan Pérez"
                                        className={`w-full p-3.5 rounded-2xl border bg-cream outline-none focus:ring-2 focus:ring-mint/50 transition-all ${darkMode ? 'border-gray-700 bg-gray-900/50' : 'border-gray-100 bg-gray-50'}`}
                                        value={formData.name}
                                        onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold uppercase tracking-wider mb-1.5 ml-1 opacity-70">Correo Electrónico</label>
                                    <input
                                        required
                                        type="email"
                                        placeholder="tu@email.com"
                                        className={`w-full p-3.5 rounded-2xl border bg-cream outline-none focus:ring-2 focus:ring-mint/50 transition-all ${darkMode ? 'border-gray-700 bg-gray-900/50' : 'border-gray-100 bg-gray-50'}`}
                                        value={formData.email}
                                        onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold uppercase tracking-wider mb-1.5 ml-1 opacity-70">Meta Financiera</label>
                                    <textarea
                                        required
                                        placeholder="Ej. Comprar mi primer depa, invertir en la bolsa..."
                                        rows="2"
                                        className={`w-full p-3.5 rounded-2xl border bg-cream outline-none focus:ring-2 focus:ring-mint/50 transition-all ${darkMode ? 'border-gray-700 bg-gray-900/50' : 'border-gray-100 bg-gray-50'}`}
                                        value={formData.goal}
                                        onChange={(e) => setFormData({ ...formData, goal: e.target.value })}
                                    ></textarea>
                                </div>

                                <button
                                    disabled={isSubmitting}
                                    type="submit"
                                    className="w-full bg-gradient-to-r from-[#1E3A8A] to-[#1e40af] text-white font-bold py-4 rounded-2xl shadow-lg shadow-navy/20 transform hover:scale-[1.02] active:scale-95 transition-all mt-4 flex items-center justify-center"
                                >
                                    {isSubmitting ? (
                                        <i className="fas fa-circle-notch fa-spin mr-2"></i>
                                    ) : (
                                        <i className="fas fa-paper-plane mr-2"></i>
                                    )}
                                    {isSubmitting ? 'Enviando...' : 'Empezar ahora'}
                                </button>
                            </form>

                            <p className="text-[10px] text-center mt-6 opacity-40 leading-tight">
                                Al registrarte, aceptas que Prosper procese tus datos para fines educativos.
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [showRegisterModal, setShowRegisterModal] = useState(false);
            const [isLoggedIn, setIsLoggedIn] = useState(() => localStorage.getItem('isLoggedIn') === 'true');
            const [userName, setUserName] = useState(() => localStorage.getItem('userName') || '');
            const [darkMode, setDarkMode] = useState(() => {
                const saved = localStorage.getItem('darkMode');
                if (saved !== null) return saved === 'true';
                return window.matchMedia('(prefers-color-scheme: dark)').matches;
            });

            React.useEffect(() => {
                localStorage.setItem('isLoggedIn', isLoggedIn);
            }, [isLoggedIn]);

            React.useEffect(() => {
                const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
                const handleChange = (e) => {
                    setDarkMode(e.matches);
                };
                mediaQuery.addEventListener('change', handleChange);
                return () => mediaQuery.removeEventListener('change', handleChange);
            }, []);

            React.useEffect(() => {
                localStorage.setItem('darkMode', darkMode);
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                    document.body.classList.add('bg-gray-900', 'text-white');
                    document.body.classList.remove('bg-cream', 'text-gray-800');
                } else {
                    document.documentElement.classList.remove('dark');
                    document.body.classList.add('bg-cream', 'text-gray-800');
                    document.body.classList.remove('bg-gray-900', 'text-white');
                }
            }, [darkMode]);

            const handleRegister = (name) => {
                setUserName(name);
                setIsLoggedIn(true);
            };

            const toggleUserMenu = () => {
                setMobileMenuOpen(!mobileMenuOpen);
            };

            return (
                <div className={`min-h-screen flex flex-col ${darkMode ? 'dark' : ''}`}>
                    <header className={`backdrop-blur-md shadow-sm sticky top-0 z-50 border-b pb-safe-top transition-colors duration-300 ${darkMode ? 'bg-gray-900/90 border-gray-800 text-white' : 'bg-white/90 border-gray-100 text-gray-800'}`}>
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between h-16 md:h-20 items-center">
                                <div className="flex items-center cursor-pointer" onClick={() => window.location.href = 'index.html'}>
                                    <div className="bg-mint text-white p-2 rounded-xl mr-3 shadow-md transform rotate-3">
                                        <i className="fas fa-chart-line text-lg"></i>
                                    </div>
                                    <span className={`font-black text-2xl tracking-tight transition-colors ${darkMode ? 'text-white' : 'text-navy'}`}>Prosper<span className="text-mint">.</span></span>
                                </div>

                                <nav className="hidden md:flex space-x-8 items-center h-full">
                                    <a href="index.html" className="h-full flex items-center text-mint border-b-4 border-mint font-bold px-1 py-1">Inicio</a>
                                    <a href="aprende.html" className="h-full flex items-center text-gray-500 hover:text-navy hover:border-b-4 hover:border-gray-300 border-b-4 border-transparent font-semibold px-1 py-1 smooth-transition">Aprende</a>
                                    <a href="tools.html" className="h-full flex items-center text-gray-500 hover:text-navy hover:border-b-4 hover:border-gray-300 border-b-4 border-transparent font-semibold px-1 py-1 smooth-transition">Herramientas</a>
                                    <a href="quiz.html" className="h-full flex items-center text-gray-500 hover:text-navy hover:border-b-4 hover:border-gray-300 border-b-4 border-transparent font-semibold px-1 py-1 smooth-transition">Quiz</a>
                                    <a href="route.html" className="h-full flex items-center text-gray-500 hover:text-navy hover:border-b-4 hover:border-gray-300 border-b-4 border-transparent font-semibold px-1 py-1 smooth-transition">Mi Ruta</a>
                                </nav>

                                <div className="flex items-center">
                                    <button onClick={toggleUserMenu} className={`p-2 rounded-xl smooth-transition focus:outline-none flex items-center w-10 h-10 justify-center ${darkMode ? 'bg-gray-800 text-white hover:bg-gray-700' : 'bg-gray-50 text-navy hover:bg-gray-100'}`}>
                                        <i className={`fas ${mobileMenuOpen ? 'fa-times' : (isLoggedIn ? 'fa-user-check text-mint' : 'fa-user')} text-xl text-center flex items-center`}></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        {mobileMenuOpen && (
                            <div className={`absolute right-4 top-16 md:right-8 md:top-20 w-64 shadow-2xl z-50 animate-fade-in rounded-2xl overflow-hidden origin-top-right border ${darkMode ? 'bg-gray-800 border-gray-700 text-white' : 'bg-white border-gray-100 text-gray-800'}`}>
                                <div className="p-3 space-y-1">
                                    <div className={`px-3 py-3 border-b mb-2 ${darkMode ? 'border-gray-700' : 'border-gray-100'}`}>
                                        <p className="text-sm font-bold">{isLoggedIn ? userName : 'Invitado'}</p>
                                        <p className="text-xs opacity-70">{isLoggedIn ? 'Usuario Verificado' : 'Sin iniciar sesión'}</p>
                                    </div>

                                    {!isLoggedIn && (
                                        <button onClick={() => { setShowRegisterModal(true); setMobileMenuOpen(false); }} className={`w-full flex items-center px-4 py-3 rounded-xl text-sm font-semibold smooth-transition text-left text-mint ${darkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-50'}`}>
                                            <i className="fas fa-sign-in-alt w-6"></i> Iniciar Sesión
                                        </button>
                                    )}

                                    <a href="acerca.html" className={`flex items-center px-4 py-3 rounded-xl text-sm font-semibold smooth-transition ${darkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-50'}`}>
                                        <i className="fas fa-info-circle w-6 text-blue-500"></i> Acerca de
                                    </a>
                                    <button onClick={() => { setDarkMode(!darkMode); setMobileMenuOpen(false); }} className={`w-full flex items-center justify-between px-4 py-3 rounded-xl text-sm font-semibold smooth-transition text-left ${darkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-50'}`}>
                                        <div className="flex items-center">
                                            <i className={`fas ${darkMode ? 'fa-sun text-yellow-500' : 'fa-moon text-indigo-500'} w-6`}></i>
                                            Tema {darkMode ? 'Claro' : 'Oscuro'}
                                        </div>
                                    </button>
                                    {isLoggedIn && (
                                        <button onClick={() => { localStorage.clear(); window.location.reload(); }} className={`w-full flex items-center px-4 py-3 rounded-xl text-sm font-semibold smooth-transition text-left text-red-500 ${darkMode ? 'hover:bg-gray-700' : 'hover:bg-gray-50'}`}>
                                            <i className="fas fa-sign-out-alt w-6"></i> Cerrar Sesión
                                        </button>
                                    )}
                                </div>
                            </div>
                        )}
                    </header>

                    <main className="flex-grow max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 md:py-12 pb-24 md:pb-12 w-full">
