    <script>
        tailwind.config = {
            darkMode: 'class',

                extend: {
                    colors: {

                        'fade-in': 'fadeIn 0.4s ease-out',

                            '100%': { opacity: '1', transform: 'translateY(0)' },

                            '0%, 100%': { transform: 'translateY(0)' },

                        },
                        marquee: {

                            '100%': { transform: 'translateX(-50%)' },

    </script>
    <script>
            // Aplicar el modo oscuro inmediatamente para evitar el flash blanco
            (function () {
                const savedMode = localStorage.getItem('darkMode');
                const systemMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const isDark = savedMode === 'true' || (savedMode === null && systemMode);
                if (isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            })();
    </script>

    <!-- Script de control (Síncrono) -->
    <script>
        (function () {
            const modal = document.getElementById('welcome-modal');
            const noMostrar = localStorage.getItem('no_mostrar_bienvenida');
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            const userName = localStorage.getItem('userName');

            if (isLoggedIn && modal) {
                const title = modal.querySelector('h2');
                const subtitle = modal.querySelector('p');
                const authBtn = modal.querySelector('button[onclick*="auth.html"]');

                if (title) title.innerText = `¡Hola de nuevo, ${userName || 'Prosperer'}!`;
                if (subtitle) subtitle.innerText = 'Ya tienes tu cuenta activada y lista.';
                if (authBtn) {
                    authBtn.innerHTML = '<i class="fas fa-check-circle text-mint mr-2"></i>Ya estás registrado';
                    authBtn.className = "w-full bg-white dark:bg-gray-700 text-navy dark:text-white font-black py-4 rounded-2xl flex items-center justify-center gap-3 border-2 border-mint/30 shadow-xl cursor-default";
                    authBtn.onclick = null;
                }
            }

            if (!noMostrar) {
                setTimeout(() => { modal.style.display = 'flex'; }, 500);
            }

            document.getElementById('welcome-close-btn').onclick = function () {
                if (document.getElementById('welcome-dont-show').checked) {
                    localStorage.setItem('no_mostrar_bienvenida', 'true');
                }
                modal.style.display = 'none';
            };
        })();
    </script>

    <script type="text/babel">
        const { useState } = React;

        function NewsSlider() {
            const newsItems = [
                { title: "Regla del 50/30/20", desc: "El mejor presupuesto para tus finanzas en automático.", icon: "fa-chart-pie", color: "text-blue-500", bg: "bg-blue-50" },
                { title: "Fondo de Emergencia", desc: "Ahorra 3 a 6 meses de gastos ante imprevistos.", icon: "fa-piggy-bank", color: "text-mint", bg: "bg-mint-light" },
                { title: "Tarjetas de Crédito", desc: "¿El secreto? Sé 'totalero' antes del corte.", icon: "fa-credit-card", color: "text-purple-500", bg: "bg-purple-50" },
                { title: "Interés Compuesto", desc: "El efecto que multiplica tus inversiones.", icon: "fa-chart-line", color: "text-yellow-500", bg: "bg-yellow-50" }
            ];

            const [currentIndex, setCurrentIndex] = useState(0);

            const nextSlide = () => {
                setCurrentIndex((prev) => (prev + 1) % newsItems.length);
            };

            const prevSlide = () => {
                setCurrentIndex((prev) => (prev - 1 + newsItems.length) % newsItems.length);
            };

            const item = newsItems[currentIndex];

            return (
                <div className="mb-8 w-full">
                    <div className="bg-white dark:bg-gray-800 rounded-3xl p-4 md:p-6 shadow-sm border border-gray-100 dark:border-gray-700 relative items-center justify-between flex flex-col group min-h-[160px] transition-colors duration-300">

                        <div className="flex items-center justify-between w-full flex-grow">
                            <button onClick={prevSlide} className="w-10 h-10 rounded-full hover:bg-gray-50 dark:hover:bg-gray-700 flex items-center justify-center text-gray-400 dark:text-gray-500 hover:text-mint smooth-transition z-10 focus:outline-none shrink-0">
                                <i className="fas fa-chevron-left text-lg"></i>
                            </button>

                            <div className="flex-1 px-2 md:px-4 text-center cursor-pointer animate-fade-in" onClick={() => window.location.href = 'aprende.html'}>
                                <div className={`w-10 h-10 md:w-12 md:h-12 ${item.bg} rounded-full mx-auto flex items-center justify-center mb-2 md:mb-3 shadow-sm`}>
                                    <i className={`fas ${item.icon} ${item.color} text-lg md:text-xl`}></i>
                                </div>
                                <h3 className="font-extrabold text-navy dark:text-white text-sm md:text-lg mb-1 tracking-tight">{item.title}</h3>
                                <p className="text-gray-600 dark:text-gray-400 text-xs md:text-sm font-medium line-clamp-2 md:line-clamp-none">{item.desc}</p>
                            </div>

                            <button onClick={nextSlide} className="w-10 h-10 rounded-full hover:bg-gray-50 dark:hover:bg-gray-700 flex items-center justify-center text-gray-400 dark:text-gray-500 hover:text-mint smooth-transition z-10 focus:outline-none shrink-0">
                                <i className="fas fa-chevron-right text-lg"></i>
                            </button>
                        </div>

                        <div className="flex justify-center space-x-2 mt-4">
                            {newsItems.map((_, idx) => (
                                <button
                                    key={idx}
                                    onClick={() => setCurrentIndex(idx)}
                                    className={`h-2 rounded-full smooth-transition ${idx === currentIndex ? 'w-6 bg-mint' : 'w-2 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600'}`}
                                ></button>
                            ))}
                        </div>

                    </div>
                </div>
            );
        }

        function Dashboard({ contentWidth }) {
            const [habits, setHabits] = useState([]);
            const [loading, setLoading] = useState(true);
            const [showTutorialBtn, setShowTutorialBtn] = useState(() => {
                return localStorage.getItem('hide_tutorial_btn') !== 'true';
            });
            const [showDismissModal, setShowDismissModal] = useState(false);

            const handleDismissTutorial = () => {
                setShowDismissModal(true);
            };

            const confirmDismiss = () => {
                setShowTutorialBtn(false);
                localStorage.setItem('hide_tutorial_btn', 'true');
                setShowDismissModal(false);
            };

            // Cargar datos iniciales de localStorage y Firebase
            React.useEffect(() => {
                const saved = localStorage.getItem('user_habits');
                if (saved) setHabits(JSON.parse(saved));

                const checkFirebase = setInterval(() => {
                    if (window._firebaseRuta?.inicializar) {
                        clearInterval(checkFirebase);
                        window._firebaseRuta.inicializar({
                            onSesion: (u) => !u && setLoading(false),
                            onHabitosListos: (h) => {
                                if (h) {
                                    setHabits(h);
                                    localStorage.setItem('user_habits', JSON.stringify(h));
                                }
                                setLoading(false);
                            }
                        });
                    }
                }, 100);
                setTimeout(() => clearInterval(checkFirebase), 5000);
            }, []);

            const completedCount = habits.filter(h => h.completed).length;
            const totalCount = habits.length;
            const progress = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : 0;

            // Determinar el próximo paso lógico
            const nextHabit = habits.find(h => !h.completed);
            const nextStepText = nextHabit ? nextHabit.text : (totalCount > 0 ? "¡Ruta completada! 🎉" : "Cargando ruta...");

            return (
                <div className="animate-fade-in">
                    {/* Botón de tutorial */}
                    {showTutorialBtn && (
                        <div className="mb-6 flex justify-center px-4 md:px-0">
                            <div className="relative inline-block w-full md:w-auto">
                                <a href="acerca.html#tutorial" className="bg-mint hover:bg-mint-hover text-white font-black py-4 pl-6 pr-16 rounded-[1.25rem] shadow-xl md:hover:scale-[1.02] transition-all text-xs md:text-sm uppercase tracking-widest flex items-center gap-3 justify-center text-center">
                                    <i className="fas fa-play-circle text-2xl"></i>
                                    Tutorial: Cómo usar la app
                                </a>
                                <button
                                    onClick={handleDismissTutorial}
                                    className="absolute right-2 top-1/2 -translate-y-1/2 w-12 h-12 rounded-xl text-white/70 hover:text-white hover:bg-red-500/80 transition-colors flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-white/50"
                                    title="Quitar Botón"
                                    aria-label="Cerrar tutorial"
                                >
                                    <i className="fas fa-times text-xl"></i>
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Modal de Confirmación */}
                    {showDismissModal && (
                        <div className="fixed inset-0 z-[500] flex items-center justify-center p-4 bg-navy/80 backdrop-blur-md animate-fade-in transition-all">
                            <div className="bg-white dark:bg-[#0F172A] w-full max-w-sm rounded-[2rem] shadow-2xl overflow-hidden border border-gray-100 dark:border-white/5 mx-auto text-center p-6">
                                <div className="w-16 h-16 bg-red-100 dark:bg-red-900/30 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                                    <i className="fas fa-exclamation-triangle"></i>
                                </div>
                                <h3 className="text-2xl font-black text-navy dark:text-white mb-2">¿Ocultar Tutorial?</h3>
                                <p className="text-sm text-gray-500 dark:text-gray-400 font-medium mb-6">
                                    El botón desaparecerá del inicio, pero aún podrás ver el tutorial en <strong className="text-mint">Aprende {'>'} Acerca de Prosper</strong>.
                                </p>
                                <div className="flex gap-3">
                                    <button 
                                        onClick={() => setShowDismissModal(false)}
                                        className="flex-1 py-3 text-xs font-black uppercase tracking-widest text-gray-500 hover:text-navy dark:hover:text-white transition-colors border border-gray-200 dark:border-gray-700 rounded-xl"

        function NotificationToast() {
            const [data, setData] = React.useState({ show: false, message: "", type: "success" });

            React.useEffect(() => {
                const handler = (e) => {
                    setData({ show: true, message: e.detail.message, type: e.detail.type || "success" });
                    setTimeout(() => setData(prev => ({ ...prev, show: false })), 4000);
                };
                window.addEventListener('prosper-alert', handler);
                window.showToast = (message, type = "success") => {
                    window.dispatchEvent(new CustomEvent('prosper-alert', { detail: { message, type } }));
                };
                return () => window.removeEventListener('prosper-alert', handler);
            }, []);

            if (!data.show) return null;

            const colors = {
                success: 'bg-mint text-white border-mint-hover shadow-lg shadow-mint/20',
                error: 'bg-red-500 text-white border-red-600 shadow-lg shadow-red-500/20',
                info: 'bg-navy dark:bg-gray-800 text-white border-blue-600 shadow-lg shadow-navy/20'
            };

            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                info: 'fa-info-circle'
            };

            return (
                <div
                    className={`fixed top-8 left-1/2 -translate-x-1/2 z-[500] px-6 py-4 rounded-[1.5rem] border-2 flex items-center gap-4 animate-fade-in transition-all active:scale-95 cursor-pointer max-w-[90%] w-auto ${colors[data.type]}`}
                    onClick={() => setData({ ...data, show: false })}
                >
                    <i className={`fas ${icons[data.type]} text-2xl`}></i>
                    <div className="flex flex-col">
                        <span className="text-[10px] font-black uppercase tracking-widest leading-none mb-1 opacity-70">
                            {data.type === 'success' ? 'Éxito' : (data.type === 'error' ? 'Error' : 'Notificación')}
                        </span>
                        <span className="text-xs font-bold leading-tight">{data.message}</span>
                    </div>
                </div>
            );
        }
