<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador Logo Prosper</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mint: '#10B981',
                        navy: '#1E3A8A',
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                }
            }
        }
    </script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Librería para convertir HTML a JPG/PNG -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f3f4f6; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            margin: 0;
        }
        /* El recuadro exacto que se capturará */
        #capture-area {
            background-color: white; /* JPG necesita un fondo sólido */
            padding: 80px 100px;
            display: inline-flex;
            align-items: center;
            border-radius: 40px; /* Bordes suaves o se puede quitar */
        }
        /* Para que FontAwesome cargue correctamente antes de capturar */
        .fa-chart-line:before { content: "\f201"; }
    </style>
</head>
<body>

    <p class="text-gray-500 mb-8 font-medium">Este es tu logo generado con código. Haz clic en el botón para descargarlo como imagen JPG de alta resolución.</p>

    <!-- ÁREA DEL LOGO QUE SERÁ TRANSFORMADA A IMAGEN -->
    <div id="capture-area" class="shadow-lg">
        <div class="bg-mint text-white rounded-3xl mr-6 shadow-md transform rotate-3 flex items-center justify-center flex-shrink-0" style="width: 90px; height: 90px; padding: 20px;">
            <i class="fas fa-chart-line" style="font-size: 45px;"></i>
        </div>
        <span class="font-black text-navy tracking-tight" style="font-size: 85px;">Prosper<span class="text-mint">.</span></span>
    </div>

    <!-- Controles -->
    <div class="mt-12 flex gap-4">
        <button id="btn-jpg" class="bg-navy hover:bg-blue-900 text-white px-8 py-4 rounded-xl font-bold shadow-lg transition-transform hover:scale-105 flex items-center">
            <i class="fas fa-file-image mr-3"></i> Descargar como JPG (Fondo Blanco)
        </button>
        <button id="btn-png" class="bg-mint hover:bg-emerald-600 text-white px-8 py-4 rounded-xl font-bold shadow-lg transition-transform hover:scale-105 flex items-center">
            <i class="fas fa-image mr-3"></i> Descargar como PNG (Transparente)
        </button>
    </div>

    <script>
        // Esperamos a que la fuente y los íconos de FontAwesome carguen correctamente
        window.onload = function() {
            setTimeout(inicializarBotones, 1500); // 1.5s de espera para asegurar que la fuente cargue
        };

        function inicializarBotones() {
            const captureArea = document.querySelector("#capture-area");

            // Botón JPG
            document.getElementById('btn-jpg').addEventListener('click', function() {
                // Quitamos la sombra y borde redondo por un segundo para que el logo salga cuadrado y sin artefactos
                captureArea.classList.remove('shadow-lg');
                captureArea.style.borderRadius = '0px';

                html2canvas(captureArea, {
                    scale: 4, // Multiplica la resolución x4 (alta calidad)
                    backgroundColor: "#ffffff",
                    useCORS: true
                }).then(canvas => {
                    let link = document.createElement('a');
                    link.download = 'Prosper_Logo.jpg';
                    link.href = canvas.toDataURL('image/jpeg', 1.0);
                    link.click();
                    
                    // Restauramos los estilos visuales
                    captureArea.classList.add('shadow-lg');
                    captureArea.style.borderRadius = '40px';
                });
            });

            // Botón PNG
            document.getElementById('btn-png').addEventListener('click', function() {
                captureArea.classList.remove('shadow-lg');
                captureArea.style.backgroundColor = "transparent"; // Fondo transparente para el PNG

                html2canvas(captureArea, {
                    scale: 4, 
                    backgroundColor: null, // Transparencia activada
                    useCORS: true
                }).then(canvas => {
                    let link = document.createElement('a');
                    link.download = 'Prosper_Logo_Transparente.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    
                    captureArea.classList.add('shadow-lg');
                    captureArea.style.backgroundColor = "white";
                });
            });
        }
    </script>
</body>
</html>
